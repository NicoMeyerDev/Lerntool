titel: Alltag und Ausland
beschreibung: Du erzählst, was gerade passiert und was früher war, findest dich schriftlich im Ausland zurecht und schreibst kurze Nachrichten und E-Mails auf Englisch. Start bei A2, die Hörabschnitte folgen später.
projekt:
  titel: Reiseplan
  beschreibung: |
    Du planst eine **erfundene** Reise und schreibst dazu drei kurze Texte auf Englisch.
    Alles geht auf Papier oder in einer Textdatei. Den Hörteil gibt es erst, wenn die
    Audio-Umsetzung steht.

    **Aufgabe:** Wähle ein Reiseziel. Lege Anreise, Unterkunft und drei Programmpunkte fest.
    Schreibe dann:

    1. eine Buchungsanfrage per E-Mail an eine Unterkunft,
    2. eine Kurznachricht an einen Freund, mit der du ihn zur Reise einlädst oder einen Plan abstimmst,
    3. einen kurzen Tagesplan mit *going to* oder *will*.

    Füge außerdem einen Satz hinzu, der zwei Dinge vergleicht (mit *than*), und einen kurzen
    Rückblick auf eine frühere Reise im *past simple* mit einer Zeitangabe.

    **Regeln:**

    - Nutze nur Wörter und Sätze, die du verstehst. Einfache, klare Sätze sind besser als schwierige.
    - Prüfe jeden Text am Ende noch einmal auf kleine Fehler.
    - Schreibe keine echten persönlichen Daten (Telefon, Adresse) in Texte, die du weitergibst.

    **Tipp:** Nimm die Mustertexte der Lektionen als Vorlage und ändere sie auf deine Reise ab.
    Quelle: [An email to book a hotel](https://learnenglish.britishcouncil.org/skills/writing/a1-writing/email-book-hotel) und [Messaging to make plans](https://learnenglish.britishcouncil.org/free-resources/writing/a2/messaging-make-plans).
  punkte:
    - Reiseziel, Anreise, Unterkunft und drei Programmpunkte sind festgelegt.
    - Die Buchungsanfrage hat Anrede, Daten, Zimmerart, Frühstückswunsch und die Bitte um Bestätigung.
    - Die Buchungsanfrage enthält eine höfliche Bitte mit *Could you ...* oder *Would you ...*.
    - Die Kurznachricht enthält einen Vorschlag (zum Beispiel *How about ...?* oder *Shall we ...?*).
    - Der Tagesplan nutzt mindestens drei Sätze mit *going to* oder *will*.
    - Ein Satz vergleicht zwei Dinge mit einem Vergleich und *than*.
    - Ein kurzer Rückblick auf eine frühere Reise steht in der Vergangenheit (*past simple*), mit Zeitangabe.
    - Alle drei Texte sind auf kleine Fehler geprüft.
