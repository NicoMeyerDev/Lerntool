titel: Controller, Anfragen und Antworten
zusammenfassung: Controller schreiben, Ressourcen-Routen, Eingaben der Anfrage lesen, JSON-Antworten mit Statuscodes.
quellen:
  - titel: Laravel 13.x – Controllers
    url: https://laravel.com/docs/13.x/controllers
  - titel: Laravel 13.x – HTTP requests
    url: https://laravel.com/docs/13.x/requests
  - titel: Laravel 13.x – HTTP responses
    url: https://laravel.com/docs/13.x/responses
  - titel: Laravel 13.x API – ResponseFactory (noContent)
    url: https://api.laravel.com/docs/13.x/Illuminate/Routing/ResponseFactory.html
abschnitte:
  - titel: Controller
    inhalt: |
      Mit der Zeit werden Closures in den Routen unübersichtlich. Ein **Controller** ist eine
      Klasse, die zusammengehörigen Code bündelt. Jede öffentliche Methode bearbeitet eine
      Anfrage.

      ```bash
      php artisan make:controller TrainingController
      ```

      ```php
      namespace App\Http\Controllers;

      class TrainingController extends Controller
      {
          public function index(): array
          {
              return ['Lauf', 'Rad'];
          }
      }
      ```

      Die Route zeigt dann auf die Methode:

      ```php
      use App\Http\Controllers\TrainingController;

      Route::get('/trainings', [TrainingController::class, 'index']);
      ```

      **Bild:** Die Route ist das Türschild, der Controller das Büro dahinter.

      Für Standard-Aktionen wie Anlegen, Auflisten, Ändern und Löschen gibt es eine Abkürzung,
      die **Ressourcen-Route**. Für APIs nimmst du `Route::apiResource`:

      ```php
      Route::apiResource('trainings', TrainingController::class);
      ```

      Sie erzeugt die Routen `index`, `store`, `show`, `update` und `destroy`.

      So sieht ein vollständiger Controller dazu aus (Imports gekürzt, Validierung folgt später):

      ```php
      class TrainingController extends Controller
      {
          public function index()
          {
              return Training::all();
          }

          public function store(Request $request)
          {
              $training = Training::create($request->all());
              return response()->json($training, 201);
          }

          public function show(Training $training)
          {
              return $training;
          }

          public function update(Request $request, Training $training)
          {
              $training->update($request->all());
              return $training;
          }

          public function destroy(Training $training)
          {
              $training->delete();
              return response()->noContent();
          }
      }
      ```

      **Route-Model-Binding:** Schreibst du in `show` den Typ `Training $training`, passt
      Laravel den Parameter `{training}` aus der Adresse zu einem Modell und lädt es für
      dich aus der Datenbank. Gibt es die Zeile nicht, antwortet Laravel automatisch mit
      **404**. Du musst dafür nichts schreiben.

      (`$request->all()` ist hier nur zum Üben. Mit Validierung ersetzt du es im Abschnitt
      „Validierung“ durch geprüfte Daten.)
    quiz:
      - frage: "Wozu dient ein Controller?"
        erklaerung: "Er bündelt zusammengehörigen Code zum Bearbeiten von Anfragen in einer Klasse."
        antworten:
          - { text: "Er bündelt den Code, der Anfragen bearbeitet, in einer Klasse.", richtig: true }
          - { text: "Er startet den Webserver bei jeder Anfrage neu.", richtig: false }
          - { text: "Er speichert Daten dauerhaft in Dateien.", richtig: false }
      - frage: "Was passiert bei `show(Training $training)`, wenn es die Zeile mit dieser ID nicht gibt?"
        erklaerung: "Route-Model-Binding antwortet automatisch mit 404."
        antworten:
          - { text: "Laravel übergibt null an die Methode.", richtig: false }
          - { text: "Laravel antwortet automatisch mit 404.", richtig: true }
          - { text: "Laravel legt die Zeile neu an.", richtig: false }
      - frage: "Welche fünf Controller-Methoden gehören zu `Route::apiResource`?"
        erklaerung: "index, store, show, update und destroy."
        antworten:
          - { text: "create, edit, show, list, remove", richtig: false }
          - { text: "get, post, put, patch, head", richtig: false }
          - { text: "index, store, show, update, destroy", richtig: true }
  - titel: Eingaben der Anfrage lesen
    inhalt: |
      Daten, die der Client mitschickt, liest du über das **Request**-Objekt. Laravel
      reicht es automatisch in die Methode, wenn du den Typ angibst:

      ```php
      use Illuminate\Http\Request;

      public function store(Request $request)
      {
          $sportart = $request->input('sportart');
          $alle = $request->all();
      }
      ```

      - `input('name')` liest einen Wert, egal ob aus dem Formular, der Adresse oder
        einem JSON-Body.
      - `all()` liefert alle Eingaben als Array.
      - `input('name', 'standard')` nimmt einen Standardwert, falls es ihn nicht gibt.

      **Wichtig:** Eingaben kommen von außen und sind nie vertrauenswürdig. Du prüfst sie
      im Abschnitt „Validierung“.
    quiz:
      - frage: "Wie liest du den Wert `sportart` aus der Anfrage?"
        erklaerung: "`$request->input('sportart')` liest den Wert."
        antworten:
          - { text: "$request->input('sportart')", richtig: true }
          - { text: "Request::sportart", richtig: false }
          - { text: "$_GLOBAL['sportart']", richtig: false }
      - frage: "Warum darf man Eingaben nicht blind vertrauen?"
        erklaerung: "Sie kommen von außen und können falsch oder bösartig sein."
        antworten:
          - { text: "Weil PHP sie nach der Anfrage sofort wieder löscht.", richtig: false }
          - { text: "Sie kommen von außen und können falsch oder bösartig sein.", richtig: true }
          - { text: "Weil sie immer zu groß für den Speicher sind.", richtig: false }
  - titel: Antworten und Statuscodes
    inhalt: |
      Ein Controller gibt eine Antwort zurück. Für eine JSON-API nutzt du:

      ```php
      return response()->json(['id' => 1, 'sportart' => 'Lauf'], 201);
      ```

      Der zweite Wert ist der **HTTP-Statuscode**. Wichtige Codes:

      - `200` – alles gut.
      - `201` – etwas wurde neu angelegt.
      - `204` – erfolgreich, aber ohne Inhalt (typisch nach dem Löschen).
      - `404` – nicht gefunden.
      - `422` – die Eingaben sind ungültig.

      Für „erfolgreich, aber ohne Inhalt“ (204) gibt es eine Kurzform:

      ```php
      return response()->noContent();
      ```

      Zur Erinnerung: Gibst du einfach ein Array oder ein Eloquent-Modell zurück, macht
      Laravel automatisch JSON daraus (Status 200).

      Eine **Weiterleitung** schickt den Browser woandershin, mit `redirect('/ziel')`. Bei
      reinen APIs brauchst du sie selten.
    quiz:
      - frage: "Welcher Statuscode passt zu „neu angelegt“?"
        erklaerung: "201 bedeutet „Created“."
        antworten:
          - { text: "404", richtig: false }
          - { text: "500", richtig: false }
          - { text: "201", richtig: true }
      - frage: "Wie sendest du eine JSON-Antwort mit Status 201?"
        erklaerung: "`response()->json($daten, 201)`."
        antworten:
          - { text: "response()->json($daten, 201)", richtig: true }
          - { text: "echo json($daten) . 201", richtig: false }
          - { text: "return 201->json($daten)", richtig: false }
test:
  zeitlimit_minuten: 15
  fragen:
    - frage: "Wie verweist eine Route auf die Methode `index` des `TrainingController`?"
      erklaerung: "Als Array aus Klasse und Methodenname."
      antworten:
        - { text: "Route::get('/trainings', 'index.TrainingController');", richtig: false }
        - { text: "Route::get('/trainings', [TrainingController::class, 'index']);", richtig: true }
        - { text: "Route::get('/trainings', TrainingController->index);", richtig: false }
    - frage: "Was liefert `$request->all()`?"
      erklaerung: "Alle Eingaben der Anfrage als Array."
      antworten:
        - { text: "Alle Routen der Anwendung.", richtig: false }
        - { text: "Nur die Adresse der Anfrage.", richtig: false }
        - { text: "Alle Eingaben der Anfrage als Array.", richtig: true }
    - frage: "Welcher Statuscode passt nach einem erfolgreichen Löschen ohne Antwortinhalt?"
      erklaerung: "204 bedeutet „No Content“."
      antworten:
        - { text: "204", richtig: true }
        - { text: "201", richtig: false }
        - { text: "422", richtig: false }
    - frage: "Welcher Statuscode steht für ungültige Eingaben?"
      erklaerung: "422 bedeutet, dass die Anfrage nicht verarbeitet werden kann, weil Eingaben ungültig sind."
      antworten:
        - { text: "301", richtig: false }
        - { text: "422", richtig: true }
        - { text: "200", richtig: false }
    - frage: "Was passiert bei `show(Training $training)`, wenn die ID nicht existiert?"
      erklaerung: "Das implizit gebundene Modell wird nicht gefunden, Laravel antwortet mit 404."
      antworten:
        - { text: "Laravel legt ein neues Training an.", richtig: false }
        - { text: "Laravel antwortet mit 201.", richtig: false }
        - { text: "Laravel antwortet mit 404.", richtig: true }
