abschnitte:
  - titel: Operatoren – rechnen, vergleichen, verknüpfen
    inhalt: |
      **Operatoren** sind kleine Zeichen, die etwas mit Werten tun.

      **Rechnen:**

      ```php
      $a = 7;
      echo $a + 2;   // 9
      echo $a - 2;   // 5
      echo $a * 2;   // 14
      echo $a / 2;   // 3.5
      echo $a % 2;   // 1  (Rest der Division)
      echo $a ** 2;  // 49 (hoch 2)
      ```

      **Kurzformen** sparen Tipparbeit:

      ```php
      $summe = 0;
      $summe += 5;   // wie $summe = $summe + 5
      $summe++;      // um 1 erhöhen
      $text = "Hallo";
      $text .= " Welt";  // Text anhängen
      ```

      **Vergleichen** liefert `true` oder `false`: `<`, `>`, `<=`, `>=`, `===`, `!==`.

      **Verknüpfen** von Bedingungen:

      - `&&` – und (beide müssen stimmen)
      - `||` – oder (eines genügt)
      - `!` – nicht (dreht um)

      *Eselsbrücke Python:* Dort heißen sie `and`, `or`, `not`. In PHP nimmst du `&&`, `||`, `!`.

      **Reihenfolge beim Rechnen:** Es gilt Punkt vor Strich. Klammern gehen vor.

      ```php
      echo 2 + 3 * 4;    // 14
      echo (2 + 3) * 4;  // 20
      ```

      **Ganzzahl und Rest:** `/` liefert eine Kommazahl, wenn die Division nicht aufgeht
      (`7 / 2` ergibt `3.5`). Willst du nur den ganzen Teil, nimmst du `intdiv(7, 2)` (ergibt `3`).
      Den Rest liefert `%`.

      **`==` oder `===`?** Beide vergleichen, aber unterschiedlich streng:

      ```php
      var_dump("5" == 5);   // bool(true)  – PHP wandelt den Typ um
      var_dump("5" === 5);  // bool(false) – Text und Zahl sind verschieden
      ```

      `===` prüft Wert **und** Typ. Als Faustregel nimmst du `===`, dann gibt es keine Überraschungen.

      **Typischer Fehler:** Ein einzelnes `=` speichert, es vergleicht nicht.
      `if ($alter = 18)` setzt `$alter` auf 18, statt zu fragen, ob es 18 ist.
      Merke: ein Gleichheitszeichen schreibt, drei Gleichheitszeichen fragen.

      **Zählen mit `++`:** `$a++` und `++$a` erhöhen beide `$a` um 1, aber nicht gleich früh.
      `$a++` liefert zuerst den **alten** Wert und erhöht danach. `++$a` erhöht zuerst und liefert dann den **neuen** Wert.

      ```php
      $a = 5;
      echo $a++;   // 5 – gibt den alten Wert aus, danach ist $a = 6
      echo ++$a;   // 7 – erhöht zuerst auf 7, gibt dann 7 aus
      ```

      Im Alltag schreibst du meist `$i++` als eigene Zeile. Dann ist der Unterschied egal.
      Wichtig wird er, wenn du den Wert gleich weiterverwendest.

      ## Probier es selbst

      Lege eine Datei `uebung.php` an (sie beginnt mit `<?php`) und starte sie mit `php uebung.php`.
      Wie das geht, steht in der Lektion „Erste Schritte, Variablen und Typen“.
      Rate vor dem Start jeweils, was herauskommt.

      1. Teile 17 durch 5. Gib mit `intdiv` den ganzen Teil und mit `%` den Rest aus.
         *Kontrolle:* 3 und 2.
      2. Setze `$punkte = 10;`. Ziehe mit `-=` 3 ab und multipliziere dann mit `*=` mit 2. Gib `$punkte` aus.
         *Kontrolle:* 14.
      3. Was gibt `var_dump(10 === "10");` aus? Rate zuerst, probiere dann.
         *Kontrolle:* `bool(false)`.
      4. Schreibe einen Ausdruck, der prüft, ob `$alter` zwischen 18 und 65 liegt (beide eingeschlossen),
         und gib ihn mit `var_dump` aus. Teste mit `$alter = 30;` und mit `$alter = 70;`.
         *Kontrolle:* `bool(true)`, dann `bool(false)`.
      5. Gerade oder ungerade? Eine Zahl ist gerade, wenn der Rest bei Division durch 2 gleich 0 ist.
         Schreibe `var_dump($zahl % 2 === 0);` und teste mit `8` und mit `7`.
         *Kontrolle:* `bool(true)`, dann `bool(false)`.
      6. Klammern ändern das Ergebnis. Rechne zuerst im Kopf, dann prüfe mit `echo`:
         `10 - 4 / 2` und `(10 - 4) / 2`. *Kontrolle:* 8 und 3.
      7. Hoch- und Runterzählen: Setze `$a = 5;`. Gib `$a++` in einer eigenen Zeile aus (mit `echo $a++ . "\n";`),
         danach in der nächsten Zeile `$a`. Rate vorher, was jeweils herauskommt.
         *Kontrolle:* erst 5, dann 6. Der Grund steht im Kasten „Zählen mit ++“ oben.
    quiz:
      - frage: "Was liefert `7 % 2`?"
        erklaerung: "`%` ist der Rest einer Division. 7 geteilt durch 2 ist 3 Rest 1."
        antworten:
          - { text: "3.5", richtig: false }
          - { text: "3", richtig: false }
          - { text: "1", richtig: true }
      - frage: "Was bewirkt `$summe += 5;`?"
        erklaerung: "`+=` addiert den Wert zur Variablen dazu. Es ist die Kurzform von `$summe = $summe + 5;`."
        antworten:
          - { text: "Es addiert 5 zu $summe.", richtig: true }
          - { text: "Es setzt $summe auf 5.", richtig: false }
          - { text: "Es vergleicht $summe mit 5.", richtig: false }
      - frage: "Welcher Ausdruck ist nur wahr, wenn BEIDE Bedingungen stimmen?"
        erklaerung: "`&&` bedeutet „und“: beide Seiten müssen true sein."
        antworten:
          - { text: "$a > 1 || $b > 1", richtig: false }
          - { text: "$a > 1 && $b > 1", richtig: true }
          - { text: "!($a > 1)", richtig: false }
      - frage: "Was gibt `echo 2 + 3 * 4;` aus?"
        erklaerung: "Punkt vor Strich: erst 3 * 4 = 12, dann 2 + 12 = 14."
        antworten:
          - { text: "20", richtig: false }
          - { text: "14", richtig: true }
          - { text: "24", richtig: false }
      - frage: "Was liefert `var_dump(\"5\" === 5);`?"
        erklaerung: "`===` prüft auch den Typ. Der Text \"5\" und die Zahl 5 haben verschiedene Typen, also `bool(false)`."
        antworten:
          - { text: "bool(true)", richtig: false }
          - { text: "Fehler: Text und Zahl lassen sich nicht vergleichen", richtig: false }
          - { text: "bool(false)", richtig: true }
      - frage: "Was gibt `$a = 5; echo $a++;` aus?"
        erklaerung: "`$a++` liefert zuerst den alten Wert (5) und erhöht `$a` erst danach auf 6."
        antworten:
          - { text: "6", richtig: false }
          - { text: "5", richtig: true }
          - { text: "4", richtig: false }
  - titel: Verzweigen mit if, else und match
    inhalt: |
      Mit `if` entscheidet dein Programm, welchen Weg es nimmt.

      ```php
      $punkte = 85;

      if ($punkte >= 90) {
          echo "Sehr gut";
      } elseif ($punkte >= 50) {
          echo "Bestanden";
      } else {
          echo "Nochmal üben";
      }
      ```

      PHP prüft von oben nach unten. Der **erste** Block, dessen Bedingung stimmt, läuft.
      Danach springt PHP hinter das Ganze.

      **match** (seit PHP 8.0) wählt anhand eines Werts und gibt gleich ein Ergebnis zurück:

      ```php
      $tag = 3;

      $name = match ($tag) {
          1 => "Montag",
          2 => "Dienstag",
          3 => "Mittwoch",
          default => "unbekannt",
      };
      ```

      `match` vergleicht mit `===`, also streng. Gibt es keinen Treffer und kein `default`,
      wirft PHP einen Fehler (`UnhandledMatchError`).

      **Kurzform für zwei Fälle:**

      ```php
      $text = $punkte >= 50 ? "bestanden" : "durchgefallen";
      $name = $eingabe ?? "Gast";  // $eingabe, falls vorhanden und nicht null, sonst "Gast"
      ```

      **Bild:** Stell dir eine Weiche am Bahnhof vor. Der Zug fährt auf das **erste** Gleis, das frei ist,
      und prüft die weiteren gar nicht mehr. Genauso arbeitet eine `if`-`elseif`-Kette.

      **Typischer Fehler: falsche Reihenfolge.** Prüfe die engste Bedingung zuerst:

      ```php
      $punkte = 95;

      if ($punkte >= 50) {
          echo "Bestanden";      // läuft schon hier
      } elseif ($punkte >= 90) {
          echo "Sehr gut";       // wird nie erreicht
      }
      ```

      Bei 95 Punkten steht dort „Bestanden“, obwohl „Sehr gut“ gemeint war. Drehe die Reihenfolge um.

      **Bedingungen im `match`:** Mit `match (true)` kannst du auch Bereiche prüfen, nicht nur feste Werte.
      PHP geht die Zeilen von oben nach unten durch und nimmt die erste, deren Bedingung `true` ergibt:

      ```php
      $punkte = 95;

      $note = match (true) {
          $punkte >= 90 => "Sehr gut",
          $punkte >= 50 => "Bestanden",
          default       => "Nochmal üben",
      };
      ```

      Das liest sich oft klarer als eine lange `if`-Kette, vor allem wenn du am Ende **einen** Wert brauchst.
      Auch hier gilt: Die engste Bedingung steht oben.

      ## Probier es selbst

      1. Setze `$temperatur = 25;`. Gib „heiß“ aus ab 30 Grad, „warm“ ab 20 Grad, sonst „kühl“.
         *Kontrolle:* warm. Teste auch mit 35 und mit 5.
      2. Schreibe ein `match` für `$groesse` mit den Fällen 1 → „klein“, 2 → „mittel“, 3 → „groß“
         und `default` → „unbekannt“. *Kontrolle:* bei 2 steht „mittel“, bei 7 steht „unbekannt“.
      3. Fehlersuche: Die Beispielkette von oben liefert bei 95 Punkten das falsche Ergebnis.
         Ändere die Reihenfolge so, dass „Sehr gut“ erscheint.
         *Kontrolle:* „Sehr gut“ bei 95, „Bestanden“ bei 60.
      4. Eintrittspreis: Unter 6 Jahren ist der Eintritt „frei“, unter 18 „ermäßigt“, sonst „voll“.
         Schreibe das mit einer `if`-Kette für `$alter`. *Kontrolle:* 4 → frei, 12 → ermäßigt, 30 → voll.
      5. Schreibe die Notenkette aus Aufgabe 3 noch einmal mit `match (true)` (siehe Kasten oben).
         Die Fälle sind `$punkte >= 90`, `$punkte >= 50` und `default`.
         *Kontrolle:* 95 → „Sehr gut“, 60 → „Bestanden“, 10 → „Nochmal üben“.
      6. Standardwert: Schreibe `$name = $eingabe ?? "Gast";` einmal **ohne** vorher `$eingabe` zu setzen
         und einmal mit `$eingabe = "Nico";`. *Kontrolle:* „Gast“, dann „Nico“.
    quiz:
      - frage: "Was gibt der Code aus, wenn `$punkte = 60` ist (siehe Beispiel mit if/elseif/else)?"
        erklaerung: "60 ist nicht >= 90, aber >= 50. Der zweite Block läuft, also „Bestanden“."
        antworten:
          - { text: "Nochmal üben", richtig: false }
          - { text: "Sehr gut", richtig: false }
          - { text: "Bestanden", richtig: true }
      - frage: "Was passiert bei `match`, wenn kein Fall passt und es kein `default` gibt?"
        erklaerung: "PHP wirft einen `UnhandledMatchError`. Deshalb ist ein `default` meist sinnvoll."
        antworten:
          - { text: "PHP wirft einen Fehler.", richtig: true }
          - { text: "Der erste Fall wird genommen.", richtig: false }
          - { text: "match gibt null zurück.", richtig: false }
      - frage: "Was liefert `$name = $eingabe ?? 'Gast';`, wenn `$eingabe` den Wert `null` hat?"
        erklaerung: "Der Operator `??` nimmt den rechten Wert, wenn links null ist oder die Variable nicht existiert."
        antworten:
          - { text: "einen Fehler", richtig: false }
          - { text: "Gast", richtig: true }
          - { text: "null", richtig: false }
      - frage: "Du schreibst `if ($punkte >= 50) { ... } elseif ($punkte >= 90) { ... }`. Warum läuft der zweite Block nie?"
        erklaerung: "Alles ab 90 ist auch >= 50. Der erste passende Block läuft, die Kette bricht dort ab. Die engere Bedingung gehört nach oben."
        antworten:
          - { text: "Weil elseif nur bei Texten funktioniert.", richtig: false }
          - { text: "Weil jeder Wert ab 90 schon die erste Bedingung erfüllt.", richtig: true }
          - { text: "Weil zwischen den Blöcken ein else fehlt.", richtig: false }
      - frage: "Was gibt `echo 5 > 3 ? 'ja' : 'nein';` aus?"
        erklaerung: "5 > 3 ist wahr, also gilt der Teil vor dem Doppelpunkt: „ja“."
        antworten:
          - { text: "ja", richtig: true }
          - { text: "nein", richtig: false }
          - { text: "true", richtig: false }
      - frage: "Was gibt `match (true) { 5 > 3 => 'a', default => 'b' }` zurück?"
        erklaerung: "`match (true)` nimmt die erste Zeile, deren Bedingung `true` ist. `5 > 3` ist wahr, also kommt „a“."
        antworten:
          - { text: "b", richtig: false }
          - { text: "Es wird ein Fehler geworfen.", richtig: false }
          - { text: "a", richtig: true }
  - titel: Schleifen – etwas wiederholen
    inhalt: |
      Eine **Schleife** wiederholt Code. Du schreibst ihn einmal, PHP führt ihn mehrfach aus.

      **for** – wenn du die Anzahl kennst:

      ```php
      for ($i = 1; $i <= 3; $i++) {
          echo "Runde $i\n";
      }
      ```

      Die drei Teile in der Klammer: Start (`$i = 1`), Bedingung (`$i <= 3`), Schritt (`$i++`).

      **while** – solange eine Bedingung stimmt:

      ```php
      $zaehler = 3;
      while ($zaehler > 0) {
          echo $zaehler . "\n";
          $zaehler--;
      }
      ```

      Achtung: Wird die Bedingung nie falsch, läuft die Schleife ewig (Endlosschleife).
      Verändere deshalb in der Schleife immer etwas, das irgendwann die Bedingung beendet.

      **foreach** läuft über die Elemente eines Arrays (mehr dazu im Themenfeld Arrays):

      ```php
      foreach ([10, 20, 30] as $zahl) {
          echo $zahl . "\n";
      }
      ```

      **foreach mit Position:** Willst du zu jedem Element auch seine Nummer, schreibst du
      `foreach ($liste as $index => $wert)`. Die Zählung beginnt bei 0.

      **Bild:** Eine Laufbahn mit drei Runden. `for` ist der Trainer, der sagt: „Genau drei Runden.“
      `while` ist der Trainer, der sagt: „Lauf, bis ich Stopp rufe.“ Und `foreach` heißt: „Lauf an jeder
      Station auf der Liste vorbei.“

      **Typischer Fehler: um eins verzählt.** Der Unterschied zwischen `<` und `<=` ändert die Anzahl:

      ```php
      for ($i = 0; $i < 3; $i++)  { }   // $i = 0, 1, 2  → 3 Durchläufe
      for ($i = 0; $i <= 3; $i++) { }   // $i = 0, 1, 2, 3 → 4 Durchläufe
      ```

      Zähle im Zweifel die Werte von `$i` auf Papier mit.

      **Größere Schritte und rückwärts:** Der Schritt muss nicht `$i++` sein.

      ```php
      for ($i = 0; $i <= 10; $i += 5) { echo $i . "\n"; }   // 0, 5, 10
      for ($i = 3; $i > 0; $i--)      { echo $i . "\n"; }   // 3, 2, 1
      ```

      **Den Überblick behalten:** Schreibe bei jeder Schleife kurz auf, was **vor** der Schleife steht (Startwerte),
      was **in** der Schleife passiert und was **danach** herauskommt. Das hilft dir beim Lesen fremden Codes
      und beim Suchen von Fehlern.

      ## Probier es selbst

      1. Gib mit `for` die Zahlen 1 bis 5 aus, jede in einer eigenen Zeile.
         *Kontrolle:* 1, 2, 3, 4, 5.
      2. Berechne mit `for` die Summe der Zahlen von 1 bis 10 und gib sie aus.
         *Kontrolle:* 55.
      3. Setze `$x = 100;` und halbiere `$x` in einer `while`-Schleife, solange `$x >= 10` gilt.
         Gib danach `$x` aus. *Kontrolle:* 6.25.
      4. Gehe mit `foreach` über `[4, 8, 15, 16, 23, 42]` und gib nur die geraden Zahlen aus
         (gerade heißt: `$zahl % 2 === 0`). *Kontrolle:* 4, 8, 16, 42.
      5. Gib mit `for` und dem Schritt `$i += 2` alle ungeraden Zahlen von 1 bis 9 aus.
         *Kontrolle:* 1, 3, 5, 7, 9.
      6. Gehe mit `foreach ($tage as $index => $tag)` über `["Montag", "Dienstag", "Mittwoch"]` und gib
         Zeilen wie `0: Montag` aus. *Kontrolle:* 0: Montag, 1: Dienstag, 2: Mittwoch.
      7. Endlosschleife entschärfen: Der Code `$n = 1; while ($n < 5) { echo $n; }` hört nie auf.
         Ergänze **eine** Zeile in der Schleife, sodass sie endet. Falls du ihn vorher startest, stoppt
         `Strg + C` das Programm. *Kontrolle:* Nach der Ergänzung (`$n++;`) steht `1234` auf dem Bildschirm.
    quiz:
      - frage: "Wie oft läuft `for ($i = 1; $i <= 3; $i++)`?"
        erklaerung: "$i ist nacheinander 1, 2 und 3. Bei 4 ist die Bedingung falsch. Das sind drei Durchläufe."
        antworten:
          - { text: "4-mal", richtig: false }
          - { text: "2-mal", richtig: false }
          - { text: "3-mal", richtig: true }
      - frage: "Was ist die Gefahr bei einer while-Schleife?"
        erklaerung: "Wenn sich die Bedingung nie ändert, läuft die Schleife endlos."
        antworten:
          - { text: "Sie kann endlos laufen, wenn die Bedingung nie falsch wird.", richtig: true }
          - { text: "Sie funktioniert nur mit Zahlen und nicht mit Texten.", richtig: false }
          - { text: "Sie läuft immer genau einmal und prüft die Bedingung nie wieder.", richtig: false }
      - frage: "Wofür eignet sich `foreach` am besten?"
        erklaerung: "`foreach` geht jedes Element eines Arrays der Reihe nach durch."
        antworten:
          - { text: "um eine Datei nach Ablauf einer Frist zu löschen", richtig: false }
          - { text: "um die Elemente eines Arrays nacheinander durchzugehen", richtig: true }
          - { text: "um zwei Texte miteinander zu vergleichen", richtig: false }
      - frage: "Wie oft läuft `for ($i = 0; $i <= 3; $i++)`?"
        erklaerung: "$i ist 0, 1, 2 und 3. Erst bei 4 ist `$i <= 3` falsch. Das sind vier Durchläufe."
        antworten:
          - { text: "3-mal", richtig: false }
          - { text: "5-mal", richtig: false }
          - { text: "4-mal", richtig: true }
      - frage: "Was gibt `$s = 0; for ($i = 1; $i <= 4; $i++) { $s += $i; } echo $s;` aus?"
        erklaerung: "Es wird 1 + 2 + 3 + 4 gerechnet, das ergibt 10."
        antworten:
          - { text: "10", richtig: true }
          - { text: "4", richtig: false }
          - { text: "6", richtig: false }
      - frage: "Was gibt `foreach (['a', 'b'] as $i => $w) { echo $i; }` aus?"
        erklaerung: "Bei einer einfachen Liste sind die Schlüssel 0 und 1. `$i` ist beim ersten Durchlauf 0, beim zweiten 1. Ausgegeben wird 01."
        antworten:
          - { text: "ab", richtig: false }
          - { text: "01", richtig: true }
          - { text: "12", richtig: false }
  - titel: break und continue
    inhalt: |
      Manchmal soll eine Schleife früher enden oder einen Durchlauf überspringen.

      - **break** beendet die Schleife sofort.
      - **continue** springt zum nächsten Durchlauf.

      ```php
      for ($i = 1; $i <= 5; $i++) {
          if ($i === 2) {
              continue;   // 2 überspringen
          }
          if ($i === 4) {
              break;      // bei 4 aufhören
          }
          echo $i . "\n"; // gibt 1 und 3 aus
      }
      ```

      **Bild:** Eine Laufstrecke mit fünf Stationen. `continue` heißt: diese Station auslassen.
      `break` heißt: Lauf abbrechen und nach Hause gehen.

      **Typisches Muster:** Schleife plus Bedingung. Zum Beispiel alle Läufe durchgehen und nur
      die zählen, die länger als 5 km sind:

      ```php
      $zaehler = 0;
      foreach ([3, 8, 5, 12] as $km) {
          if ($km <= 5) {
              continue;
          }
          $zaehler++;
      }
      echo $zaehler; // 2
      ```

      **Wann was?** Frage dich: Will ich nur diesen einen Durchlauf auslassen, oder bin ich fertig?
      Nur auslassen → `continue`. Fertig, weil ich gefunden habe, was ich suche → `break`.
      Das spart Arbeit, weil die Schleife nicht unnötig weiterläuft.

      **Gut zu wissen:** Steckt eine Schleife in einer anderen, beendet `break` nur die innere.
      Mit `break 2;` verlässt du beide auf einmal (die Zahl sagt, wie viele Ebenen).

      **Falle bei `while` und `continue`:** In einer `for`-Schleife läuft der Schritt (`$i++`) nach `continue` automatisch.
      In einer `while`-Schleife nicht, denn dort steht der Schritt im Rumpf. Wird er durch `continue` übersprungen,
      ändert sich die Bedingung nie, und die Schleife läuft endlos:

      ```php
      $i = 0;
      while ($i < 5) {
          $i++;                  // zuerst erhöhen
          if ($i === 2) {
              continue;          // jetzt gefahrlos
          }
          echo $i . "\n";        // gibt 1, 3, 4, 5 aus
      }
      ```

      **Merkhilfe:** Bei `while` und `continue` zuerst den Zähler erhöhen, dann überspringen.

      ## Probier es selbst

      1. Gib die Zahlen von 1 bis 10 aus, überspringe aber alle Vielfachen von 3 mit `continue`.
         *Kontrolle:* 1, 2, 4, 5, 7, 8, 10.
      2. Suche in `[7, 12, 3, 20, 9]` die **erste** Zahl, die größer als 10 ist. Gib sie aus und
         beende die Schleife mit `break`. *Kontrolle:* 12.
      3. Du hast die Läufe `[3, 8, 5, 12, 6]` (in km). Zähle die Läufe über 5 km und addiere ihre
         Strecken. Gib beides aus. *Kontrolle:* 3 Läufe, zusammen 26 km.
      4. Zähle von 1 bis 20 und höre bei der ersten Zahl auf, die durch 7 teilbar ist. Gib die Zahlen
         **davor** aus. *Kontrolle:* 1, 2, 3, 4, 5, 6.
      5. Suche in `["apfel", "birne", "kirsche"]` mit `foreach ($liste as $index => $name)` den Eintrag
         `"birne"`. Gib bei Fund `gefunden an Position 1` aus (Position = `$index`) und beende die Schleife.
         *Kontrolle:* `gefunden an Position 1`.
      6. Fehlersuche: Diese Schleife hört nie auf. Finde den Grund und behebe ihn mit **einer** kleinen
         Änderung (`Strg + C` stoppt das Programm, falls du sie startest):
         `$i = 0; while ($i < 5) { if ($i === 2) { continue; } $i++; }`
         *Kontrolle:* Bei `$i === 2` springt `continue` zurück, ohne `$i++` auszuführen. `$i` bleibt 2.
         Setze `$i++;` **vor** das `continue;` (oder vor die Prüfung), dann endet die Schleife.
    quiz:
      - frage: "Was macht `break` in einer Schleife?"
        erklaerung: "`break` beendet die gesamte Schleife sofort."
        antworten:
          - { text: "Es startet die Schleife neu.", richtig: false }
          - { text: "Es überspringt nur den aktuellen Durchlauf.", richtig: false }
          - { text: "Es beendet die Schleife sofort.", richtig: true }
      - frage: "Was macht `continue`?"
        erklaerung: "`continue` springt direkt zum nächsten Durchlauf, der Rest des aktuellen Durchlaufs wird ausgelassen."
        antworten:
          - { text: "Es springt zum nächsten Durchlauf der Schleife.", richtig: true }
          - { text: "Es beendet die Schleife und danach das ganze Programm.", richtig: false }
          - { text: "Es wiederholt denselben Durchlauf noch einmal.", richtig: false }
      - frage: "Welche Zahlen gibt die Beispielschleife mit `continue` bei 2 und `break` bei 4 aus?"
        erklaerung: "Die 2 wird übersprungen, bei 4 endet die Schleife. Ausgegeben werden 1 und 3."
        antworten:
          - { text: "1, 2, 3", richtig: false }
          - { text: "1 und 3", richtig: true }
          - { text: "1, 3, 5", richtig: false }
      - frage: "Du suchst in einer Liste den ersten passenden Eintrag und willst danach nicht weitersuchen. Was nutzt du?"
        erklaerung: "`break` beendet die Schleife, sobald du den Treffer hast. `continue` würde nur den Durchlauf auslassen und weitersuchen."
        antworten:
          - { text: "continue", richtig: false }
          - { text: "break", richtig: true }
          - { text: "else", richtig: false }
      - frage: "Was bewirkt `break 2;` in zwei ineinander liegenden Schleifen?"
        erklaerung: "Die Zahl gibt an, wie viele Schleifenebenen verlassen werden. `break 2;` beendet innere und äußere Schleife."
        antworten:
          - { text: "Es beendet beide Schleifen.", richtig: true }
          - { text: "Es überspringt die nächsten zwei Durchläufe.", richtig: false }
          - { text: "Es wiederholt die innere Schleife zweimal.", richtig: false }
      - frage: "Warum läuft `$i = 0; while ($i < 5) { if ($i === 2) { continue; } $i++; }` endlos?"
        erklaerung: "Bei `$i === 2` springt `continue` zum nächsten Durchlauf, ohne `$i++` auszuführen. `$i` bleibt 2 und die Bedingung `$i < 5` bleibt wahr."
        antworten:
          - { text: "Weil `$i` nach `continue` wieder auf 0 gesetzt wird.", richtig: false }
          - { text: "Weil `continue` den Zähler überspringt und `$i` bei 2 hängen bleibt.", richtig: true }
          - { text: "Weil `$i === 2` die Bedingung der Schleife verändert.", richtig: false }
test:
  zeitlimit_minuten: 20
  fragen:
    - frage: "Was liefert `2 ** 3`?"
      erklaerung: "`**` ist „hoch“. 2 hoch 3 ist 8."
      antworten:
        - { text: "5", richtig: false }
        - { text: "6", richtig: false }
        - { text: "8", richtig: true }
    - frage: "Welcher Operator hängt einen Text an eine Variable an?"
      erklaerung: "`.=` hängt den rechten Text an den bestehenden Text an."
      antworten:
        - { text: ".=", richtig: true }
        - { text: "&=", richtig: false }
        - { text: "+=", richtig: false }
    - frage: "Welcher Ausdruck ist wahr, wenn mindestens eine der Bedingungen stimmt?"
      erklaerung: "`||` bedeutet „oder“. Es genügt, wenn eine Seite true ist."
      antworten:
        - { text: "$a > 0 && $b > 0", richtig: false }
        - { text: "$a > 0 || $b > 0", richtig: true }
        - { text: "!$a", richtig: false }
    - frage: "Was passiert bei einer if/elseif/else-Kette, wenn zwei Bedingungen gleichzeitig stimmen?"
      erklaerung: "PHP führt nur den ersten passenden Block aus und überspringt den Rest der Kette."
      antworten:
        - { text: "PHP meldet einen Fehler wegen der doppelten Bedingung.", richtig: false }
        - { text: "Beide passenden Blöcke laufen nacheinander.", richtig: false }
        - { text: "Nur der erste passende Block läuft.", richtig: true }
    - frage: "Was gibt `match (2) { 1 => 'a', 2 => 'b', default => 'c' }` zurück?"
      erklaerung: "Der Wert 2 passt zum zweiten Fall, also kommt „b“ zurück."
      antworten:
        - { text: "b", richtig: true }
        - { text: "c", richtig: false }
        - { text: "a", richtig: false }
    - frage: "Welche Schleife wählst du, wenn du die Anzahl der Durchläufe vorher kennst?"
      erklaerung: "Die `for`-Schleife hat Start, Bedingung und Schritt in einer Zeile, ideal für feste Anzahlen."
      antworten:
        - { text: "continue", richtig: false }
        - { text: "for", richtig: true }
        - { text: "match", richtig: false }
    - frage: "Wie viele Zahlen gibt `for ($i = 0; $i < 3; $i++) { echo $i; }` aus?"
      erklaerung: "$i ist 0, 1 und 2. Bei 3 ist `$i < 3` falsch. Das sind drei Ausgaben."
      antworten:
        - { text: "4", richtig: false }
        - { text: "2", richtig: false }
        - { text: "3", richtig: true }
    - frage: "Du willst in einer Schleife einen Durchlauf auslassen, die Schleife aber fortsetzen. Was nutzt du?"
      erklaerung: "`continue` überspringt den aktuellen Durchlauf. `break` würde die ganze Schleife beenden."
      antworten:
        - { text: "continue", richtig: true }
        - { text: "else", richtig: false }
        - { text: "break", richtig: false }
