titel: Erste Schritte, Variablen und Typen
zusammenfassung: Dein erstes PHP-Skript, Variablen, die Grundtypen, Texte (Strings) und der Unterschied zwischen == und ===.
quellen:
  - titel: PHP-Handbuch – Basic syntax
    url: https://www.php.net/manual/en/language.basic-syntax.php
  - titel: PHP-Handbuch – Variables
    url: https://www.php.net/manual/en/language.variables.php
  - titel: PHP-Handbuch – Types
    url: https://www.php.net/manual/en/language.types.php
  - titel: PHP-Handbuch – Strings
    url: https://www.php.net/manual/en/language.types.string.php
  - titel: PHP-Handbuch – Type juggling
    url: https://www.php.net/manual/en/language.types.type-juggling.php
  - titel: PHP-Handbuch – Comparison operators
    url: https://www.php.net/manual/en/language.operators.comparison.php
abschnitte:
  - titel: Das erste PHP-Skript
    inhalt: |
      PHP-Code steht in einer Datei, die mit `.php` endet. Der Code beginnt mit dem
      Öffnungs-Tag `<?php`. Du startest das Skript im Terminal mit `php datei.php`.

      ```php
      <?php

      echo "Hallo Welt";
      ```

      `echo` gibt Text aus. Jede Anweisung endet mit einem **Semikolon** `;`.
      Vergisst du es, meldet PHP einen Syntaxfehler.

      **Kommentare** erklärt der Mensch, PHP überspringt sie:

      ```php
      // Ein Kommentar in einer Zeile
      # Auch das ist ein Kommentar
      /* Ein Kommentar
         über mehrere Zeilen */
      ```

      **Bild:** Das Skript ist ein Rezept. PHP liest es von oben nach unten und führt
      jeden Schritt aus, der mit `;` endet.

      *Eselsbrücke Python:* Dort braucht eine Anweisung kein Semikolon. In PHP ist es Pflicht.
      Reine PHP-Dateien brauchen kein schließendes `?>` am Ende, du lässt es weg.
    quiz:
      - frage: "Womit beginnt PHP-Code in einer reinen PHP-Datei?"
        erklaerung: "Der Öffnungs-Tag `<?php` sagt, dass ab hier PHP-Code folgt."
        antworten:
          - { text: "mit <?php", richtig: true }
          - { text: "mit #!php", richtig: false }
          - { text: "mit <script php>", richtig: false }
      - frage: "Womit endet in PHP normalerweise jede Anweisung?"
        erklaerung: "Das Semikolon beendet eine Anweisung. Ohne es gibt es einen Syntaxfehler."
        antworten:
          - { text: "mit einem Doppelpunkt", richtig: false }
          - { text: "mit einem Semikolon", richtig: true }
          - { text: "mit einem Punkt", richtig: false }
      - frage: "Wie startest du die Datei `hallo.php` im Terminal?"
        erklaerung: "Der Befehl `php` führt die Datei aus."
        antworten:
          - { text: "run hallo.php", richtig: false }
          - { text: "hallo.php start", richtig: false }
          - { text: "php hallo.php", richtig: true }
  - titel: Variablen und Konstanten
    inhalt: |
      Eine **Variable** ist eine beschriftete Schublade, in die du einen Wert legst.
      In PHP beginnt der Name immer mit einem Dollarzeichen `$`.

      ```php
      $name = "Nico";
      $alter = 30;
      echo $name;
      ```

      Das einzelne `=` heißt **Zuweisung**: Der Wert rechts kommt in die Variable links.

      Regeln für Namen:

      - Sie beginnen nach dem `$` mit einem Buchstaben oder `_`, nicht mit einer Zahl.
      - Groß- und Kleinschreibung zählt: `$name` und `$Name` sind zwei verschiedene Variablen.

      Eine **Konstante** ist eine Schublade, die verschlossen bleibt. Sie hat kein `$`
      und ändert sich nie:

      ```php
      const MAX_LAEUFE = 10;
      echo MAX_LAEUFE;
      ```

      *Eselsbrücke Python:* Variablen werden dort ohne `$` geschrieben. Konstanten sind in
      Python nur eine Konvention (Großbuchstaben), in PHP sind sie wirklich fest.
    quiz:
      - frage: "Welcher Variablenname ist in PHP gültig?"
        erklaerung: "Variablen beginnen mit `$`, danach folgt ein Buchstabe oder `_`. Eine Zahl am Anfang ist nicht erlaubt."
        antworten:
          - { text: "$name", richtig: true }
          - { text: "$1name", richtig: false }
          - { text: "name", richtig: false }
      - frage: "Sind `$name` und `$Name` in PHP dieselbe Variable?"
        erklaerung: "Variablennamen unterscheiden Groß- und Kleinschreibung, es sind also zwei verschiedene Variablen."
        antworten:
          - { text: "Nur wenn sie im selben Skript stehen.", richtig: false }
          - { text: "Nein, es sind zwei verschiedene Variablen.", richtig: true }
          - { text: "Ja, die Schreibweise ist egal.", richtig: false }
      - frage: "Was ist der Unterschied zwischen Variable und Konstante?"
        erklaerung: "Eine Konstante wird einmal festgelegt und kann danach nicht mehr geändert werden."
        antworten:
          - { text: "Eine Konstante steht immer in Anführungszeichen.", richtig: false }
          - { text: "Eine Konstante beginnt mit $.", richtig: false }
          - { text: "Eine Konstante kann nachträglich nicht mehr geändert werden.", richtig: true }
  - titel: Die Grundtypen
    inhalt: |
      Jeder Wert hat einen **Typ**. Er sagt, was für eine Art Wert es ist.
      Die wichtigsten Grundtypen:

      - `int` – ganze Zahl, zum Beispiel `42`
      - `float` – Kommazahl (mit Punkt!), zum Beispiel `3.14`
      - `string` – Text, zum Beispiel `"Hallo"`
      - `bool` – Wahrheitswert, `true` oder `false`
      - `null` – „kein Wert“

      Mit `var_dump()` siehst du Typ und Wert:

      ```php
      var_dump(42);      // int(42)
      var_dump(3.14);    // float(3.14)
      var_dump("Hallo"); // string(5) "Hallo"
      var_dump(true);    // bool(true)
      var_dump(null);    // NULL
      ```

      **Bild:** Typen sind wie Schubladen-Formen. In die Form für Zahlen passt keine Suppe.
      `null` ist die leere Schublade.
    quiz:
      - frage: "Welchen Typ hat der Wert `3.14`?"
        erklaerung: "Zahlen mit Dezimalpunkt sind in PHP vom Typ `float`."
        antworten:
          - { text: "float", richtig: true }
          - { text: "string", richtig: false }
          - { text: "int", richtig: false }
      - frage: "Welche Funktion zeigt dir Typ und Wert einer Variablen?"
        erklaerung: "`var_dump()` gibt Typ und Wert aus, hilfreich beim Suchen von Fehlern."
        antworten:
          - { text: "echo_type()", richtig: false }
          - { text: "var_dump()", richtig: true }
          - { text: "show()", richtig: false }
      - frage: "Wofür steht `null`?"
        erklaerung: "`null` bedeutet: Es gibt keinen Wert."
        antworten:
          - { text: "für die Zahl 0", richtig: false }
          - { text: "für einen leeren Text", richtig: false }
          - { text: "für „kein Wert“", richtig: true }
  - titel: Strings – Texte
    inhalt: |
      Ein **String** ist ein Text. Du setzt ihn in einfache oder doppelte Anführungszeichen.
      Der Unterschied ist wichtig:

      ```php
      $name = "Nico";
      echo 'Hallo $name';  // Hallo $name  (wörtlich)
      echo "Hallo $name";  // Hallo Nico   (Variable wird eingesetzt)
      ```

      - **Einfache** Anführungszeichen: Der Text bleibt, wie er ist.
      - **Doppelte** Anführungszeichen: PHP setzt Variablen ein und versteht `\n` (neue Zeile).

      Texte verbindest du mit dem Punkt `.`:

      ```php
      echo "Hallo " . $name . "!";
      ```

      Nützliche Funktionen:

      ```php
      strlen("Hallo");               // 5 (Länge)
      strtoupper("hallo");           // "HALLO"
      str_contains("Laravel", "ra"); // true (seit PHP 8.0)
      ```

      *Eselsbrücke Python:* Texte verbindest du dort mit `+`, in PHP mit `.`.
    quiz:
      - frage: "Was gibt `echo 'Hallo $name';` aus?"
        erklaerung: "In einfachen Anführungszeichen wird die Variable nicht eingesetzt, der Text bleibt wörtlich."
        antworten:
          - { text: "Hallo $name", richtig: true }
          - { text: "einen Fehler", richtig: false }
          - { text: "Hallo Nico", richtig: false }
      - frage: "Womit verbindest du in PHP zwei Texte?"
        erklaerung: "Der Punkt `.` ist der Verkettungsoperator in PHP."
        antworten:
          - { text: "mit &", richtig: false }
          - { text: "mit .", richtig: true }
          - { text: "mit +", richtig: false }
      - frage: "Was liefert `strlen('Hallo')`?"
        erklaerung: "`strlen` zählt die Zeichen. „Hallo“ hat 5 Zeichen."
        antworten:
          - { text: "4", richtig: false }
          - { text: "Hallo", richtig: false }
          - { text: "5", richtig: true }
  - titel: Typumwandlung und Vergleiche
    inhalt: |
      PHP wandelt Typen oft **automatisch** um (Type Juggling). Das kann überraschen.
      Beim Vergleichen gibt es deshalb zwei Varianten:

      ```php
      var_dump(5 == "5");   // bool(true)  – nur der Wert zählt
      var_dump(5 === "5");  // bool(false) – Wert UND Typ zählen
      ```

      - `==` (lose): Typen werden angeglichen, dann verglichen.
      - `===` (strikt): Wert **und** Typ müssen gleich sein.

      **Regel für dich:** Nimm `===`. So gibt es keine Überraschungen.

      Du kannst auch selbst umwandeln (**Cast**):

      ```php
      $zahl = (int) "12";   // 12
      $ganz = (int) 3.9;    // 3 (Nachkommastellen fallen weg)
      $text = (string) 42;  // "42"
      ```

      Das Gegenstück zu `===` ist `!==` (ungleich in Wert oder Typ).
    quiz:
      - frage: "Was ergibt `5 === '5'`?"
        erklaerung: "`===` prüft auch den Typ. `5` ist ein int, `'5'` ein string, also false."
        antworten:
          - { text: "false", richtig: true }
          - { text: "einen Fehler", richtig: false }
          - { text: "true", richtig: false }
      - frage: "Welchen Wert hat `(int) 3.9`?"
        erklaerung: "Beim Cast nach int werden die Nachkommastellen abgeschnitten, nicht gerundet."
        antworten:
          - { text: "4", richtig: false }
          - { text: "3", richtig: true }
          - { text: "3.9", richtig: false }
      - frage: "Welchen Vergleich solltest du in der Regel benutzen?"
        erklaerung: "`===` vergleicht Wert und Typ und vermeidet überraschende automatische Umwandlungen."
        antworten:
          - { text: "=", richtig: false }
          - { text: "==", richtig: false }
          - { text: "===", richtig: true }
test:
  zeitlimit_minuten: 20
  fragen:
    - frage: "Was passiert, wenn am Ende einer Anweisung das Semikolon fehlt?"
      erklaerung: "PHP erwartet das Semikolon als Ende der Anweisung und meldet sonst einen Syntaxfehler."
      antworten:
        - { text: "PHP meldet einen Syntaxfehler.", richtig: true }
        - { text: "PHP ergänzt es automatisch.", richtig: false }
        - { text: "Die Zeile wird einfach übersprungen.", richtig: false }
    - frage: "Welche Zeile legt in PHP korrekt eine Variable an?"
      erklaerung: "Variablen beginnen mit `$` und bekommen den Wert per `=` zugewiesen."
      antworten:
        - { text: "alter = 30;", richtig: false }
        - { text: "$alter = 30;", richtig: true }
        - { text: "var alter = 30;", richtig: false }
    - frage: "Wie wird eine Konstante `MAX` mit dem Wert 5 festgelegt?"
      erklaerung: "Mit `const NAME = Wert;` legst du eine Konstante an. Sie hat kein `$`."
      antworten:
        - { text: "$MAX = 5;", richtig: false }
        - { text: "constant $MAX = 5;", richtig: false }
        - { text: "const MAX = 5;", richtig: true }
    - frage: "Welchen Typ hat der Wert `'42'` (in Anführungszeichen)?"
      erklaerung: "Alles in Anführungszeichen ist ein String, auch wenn es wie eine Zahl aussieht."
      antworten:
        - { text: "string", richtig: true }
        - { text: "float", richtig: false }
        - { text: "int", richtig: false }
    - frage: "Was gibt `$x = 7; echo \"Wert: $x\";` aus?"
      erklaerung: "In doppelten Anführungszeichen setzt PHP den Wert der Variablen ein."
      antworten:
        - { text: "Wert: $x", richtig: false }
        - { text: "Wert: 7", richtig: true }
        - { text: "Wert: x", richtig: false }
    - frage: "Welches Ergebnis hat `'Hallo ' . 'Welt'`?"
      erklaerung: "Der Punkt verbindet beide Texte zu „Hallo Welt“."
      antworten:
        - { text: "Hallo + Welt", richtig: false }
        - { text: "HalloWelt", richtig: false }
        - { text: "Hallo Welt", richtig: true }
    - frage: "Was ergibt `5 == '5'`?"
      erklaerung: "Der lose Vergleich gleicht die Typen an und findet beide Werte gleich."
      antworten:
        - { text: "true", richtig: true }
        - { text: "null", richtig: false }
        - { text: "false", richtig: false }
    - frage: "Warum solltest du meist `===` statt `==` verwenden?"
      erklaerung: "`===` prüft Wert und Typ und vermeidet Überraschungen durch automatische Umwandlung."
      antworten:
        - { text: "Den Operator `==` gibt es in PHP gar nicht.", richtig: false }
        - { text: "Es prüft auch den Typ und ist dadurch eindeutiger.", richtig: true }
        - { text: "Es ist schneller zu tippen.", richtig: false }
