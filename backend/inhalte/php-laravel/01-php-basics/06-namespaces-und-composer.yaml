titel: Namespaces und Composer
zusammenfassung: Klassen ordnen mit Namespaces, Pakete verwalten mit Composer und Klassen automatisch laden mit PSR-4.
quellen:
  - titel: PHP-Handbuch – Namespaces
    url: https://www.php.net/manual/en/language.namespaces.php
  - titel: Composer – Basic usage
    url: https://getcomposer.org/doc/01-basic-usage.md
  - titel: Composer – composer.json Schema, Abschnitt autoload
    url: https://getcomposer.org/doc/04-schema.md#autoload
  - titel: PHP-FIG – PSR-4 Autoloader
    url: https://www.php-fig.org/psr/psr-4/
abschnitte:
  - titel: Namespaces – Klassen ordnen
    inhalt: |
      Wenn viele Klassen existieren, können Namen doppelt vorkommen. Zwei Pakete haben
      vielleicht beide eine Klasse `Logger`. Ein **Namespace** ist wie ein Ordner oder
      Nachname, der sie auseinanderhält.

      ```php
      <?php

      declare(strict_types=1);

      namespace App\Training;

      class Lauf
      {
      }
      ```

      Der volle Name dieser Klasse ist jetzt `App\Training\Lauf`. Der Namespace steht ganz
      oben in der Datei (direkt nach `declare`).

      **Benutzen aus einem anderen Namespace** mit `use`:

      ```php
      <?php

      namespace App;

      use App\Training\Lauf;

      $lauf = new Lauf();
      ```

      Ohne `use` müsstest du den vollen Namen mit führendem Backslash schreiben:
      `new \App\Training\Lauf()`.

      **Wichtig für eingebaute Klassen:** Klassennamen löst PHP immer nur im aktuellen
      Namespace auf. Eine eingebaute Klasse wie `Exception` liegt aber im globalen Namespace.
      Ohne Hilfe meldet PHP „Class not found“. Schreibe deshalb `use Exception;` oder
      `\Exception`. (Bei Funktionen wie `strlen` ist das anders: Dort greift PHP automatisch
      auf die globale Funktion zurück.)

      Mit `as` gibst du einen Kurznamen: `use App\Training\Lauf as TrainingsLauf;`.
    quiz:
      - frage: "Wozu dienen Namespaces?"
        erklaerung: "Sie ordnen Klassen und verhindern Namenskonflikte."
        antworten:
          - { text: "Sie ordnen Klassen und vermeiden gleiche Namen.", richtig: true }
          - { text: "Sie machen Code schneller.", richtig: false }
          - { text: "Sie ersetzen Variablen.", richtig: false }
      - frage: 'Wie bindest du die Klasse `App\Training\Lauf` mit einem Kurznamen ein?'
        erklaerung: "Mit `use` und dem vollen Namen der Klasse."
        antworten:
          - { text: 'use App\Training\Lauf;', richtig: true }
          - { text: 'import App\Training\Lauf;', richtig: false }
          - { text: 'include App\Training\Lauf;', richtig: false }
      - frage: "Warum solltest du in einem Namespace `use Exception;` schreiben, bevor du `new Exception()` nutzt?"
        erklaerung: "PHP sucht Klassen nur im aktuellen Namespace. Die eingebaute Klasse liegt im globalen Namespace und muss importiert oder mit führendem Backslash geschrieben werden."
        antworten:
          - { text: "Weil PHP die Klasse sonst im eigenen Namespace sucht und nicht findet.", richtig: true }
          - { text: "Weil Exception sonst nicht erlaubt ist.", richtig: false }
          - { text: "Weil sonst der Namespace gelöscht wird.", richtig: false }
  - titel: Composer – Pakete verwalten
    inhalt: |
      **Composer** ist der Paketmanager für PHP (wie `pip` bei Python). Er holt Bibliotheken
      aus der Paketsammlung Packagist und hält fest, welche Version du nutzt.

      Alles beginnt mit der Datei `composer.json`:

      ```json
      {
          "require": {
              "monolog/monolog": "^3.0"
          }
      }
      ```

      Die wichtigsten Befehle:

      - `composer init` – legt eine neue `composer.json` an (führt dich mit Fragen).
      - `composer require anbieter/paket` – fügt ein Paket hinzu und installiert es.
      - `composer install` – installiert genau die Versionen aus `composer.lock`.
      - `composer update` – holt neuere erlaubte Versionen und schreibt die Lock-Datei neu.

      Dabei entstehen:

      - der Ordner `vendor/` mit den heruntergeladenen Paketen,
      - die Datei `composer.lock` mit den **genauen** Versionen.

      **Regeln:**

      - `composer.lock` kommt mit in Git. So hat jeder dieselben Versionen.
      - `vendor/` kommt **nicht** in Git (es lässt sich jederzeit mit `composer install` wiederherstellen).

      Das `^3.0` bedeutet: Version 3.0 oder neuer, aber unter 4.0.
    quiz:
      - frage: "Welche Datei hält die genauen installierten Versionen fest?"
        erklaerung: "`composer.lock` speichert die genauen Versionen."
        antworten:
          - { text: "composer.lock", richtig: true }
          - { text: "vendor.txt", richtig: false }
          - { text: "packages.ini", richtig: false }
      - frage: "Was macht `composer install`, wenn es eine `composer.lock` gibt?"
        erklaerung: "Es installiert genau die Versionen aus der Lock-Datei."
        antworten:
          - { text: "Es installiert genau die Versionen aus der Lock-Datei.", richtig: true }
          - { text: "Es aktualisiert alles auf die neuesten Versionen.", richtig: false }
          - { text: "Es löscht den vendor-Ordner.", richtig: false }
      - frage: "Gehört der Ordner `vendor/` in die Versionsverwaltung (Git)?"
        erklaerung: "Nein. Er lässt sich mit `composer install` jederzeit wiederherstellen."
        antworten:
          - { text: "Nein, er wird mit composer install neu erzeugt.", richtig: true }
          - { text: "Ja, immer.", richtig: false }
          - { text: "Nur am Wochenende.", richtig: false }
  - titel: Autoloading nach PSR-4
    inhalt: |
      Ohne Hilfe müsstest du jede Klassendatei von Hand mit `require` laden. Das ist mühsam.
      Mit **Autoloading** lädt PHP eine Klasse erst, wenn sie gebraucht wird, und findet die
      Datei selbst.

      Dafür gibt es eine Vereinbarung namens **PSR-4**: Der Namespace entspricht dem Ordnerpfad.

      In der `composer.json` legst du fest, welcher Namespace in welchen Ordner gehört:

      ```json
      {
          "autoload": {
              "psr-4": {
                  "App\\": "src/"
              }
          }
      }
      ```

      Dann gilt:

      - `App\Lauf` liegt in `src/Lauf.php`
      - `App\Training\Lauf` liegt in `src/Training/Lauf.php`

      Der **Dateiname** ist der Klassenname. Eine Klasse pro Datei.

      Nach dem Ändern der `autoload`-Einstellung führst du aus:

      ```
      composer dump-autoload
      ```

      Und in deinem Hauptskript lädst du einmal die automatisch erzeugte Datei:

      ```php
      require __DIR__ . '/vendor/autoload.php';
      ```

      Ab dann findet PHP alle Klassen aus `src/` und aus den Paketen von allein.
    quiz:
      - frage: 'In welcher Datei liegt die Klasse `App\Training\Lauf` bei der Zuordnung des Namespace-Präfixes `App` (in JSON als `App\\` geschrieben) auf `src/`?'
        erklaerung: 'Der Namespace nach `App\` wird zum Ordnerpfad, der Klassenname zum Dateinamen: src/Training/Lauf.php.'
        antworten:
          - { text: 'src/Training/Lauf.php', richtig: true }
          - { text: 'src/App/Training/Lauf.php', richtig: false }
          - { text: 'src/training.php', richtig: false }
      - frage: "Welche Zeile lädt im Hauptskript den Composer-Autoloader?"
        erklaerung: "Die Datei `vendor/autoload.php` wird mit `require` einmal eingebunden."
        antworten:
          - { text: "require __DIR__ . '/vendor/autoload.php';", richtig: true }
          - { text: "use vendor\\autoload;", richtig: false }
          - { text: "composer load;", richtig: false }
      - frage: "Was brauchst du nach Änderungen an der `autoload`-Einstellung in der `composer.json`?"
        erklaerung: "`composer dump-autoload` erzeugt die Autoload-Dateien neu."
        antworten:
          - { text: "composer dump-autoload", richtig: true }
          - { text: "Einen Neustart des Rechners", richtig: false }
          - { text: "php autoload.php", richtig: false }
test:
  zeitlimit_minuten: 20
  fragen:
    - frage: 'Wie lautet der volle Name der Klasse `Lauf` im Namespace `App\Training`?'
      erklaerung: "Namespace und Klassenname werden mit Backslash verbunden."
      antworten:
        - { text: 'App\Training\Lauf', richtig: true }
        - { text: 'App.Training.Lauf', richtig: false }
        - { text: 'App/Training/Lauf', richtig: false }
    - frage: "Wo steht die Zeile `namespace ...;` in einer Datei?"
      erklaerung: "Der Namespace steht ganz oben in der Datei, vor dem restlichen Code."
      antworten:
        - { text: "ganz oben, vor dem übrigen Code", richtig: true }
        - { text: "ganz unten", richtig: false }
        - { text: "mitten in einer Funktion", richtig: false }
    - frage: "Welches Composer-Kommando fügt ein neues Paket hinzu?"
      erklaerung: "`composer require` trägt das Paket ein und installiert es."
      antworten:
        - { text: "composer require anbieter/paket", richtig: true }
        - { text: "composer add-all", richtig: false }
        - { text: "composer lock", richtig: false }
    - frage: "Wozu ist die Datei `composer.lock` da?"
      erklaerung: "Sie friert die genauen Versionen ein, damit alle dieselben Pakete nutzen."
      antworten:
        - { text: "Sie hält die genauen Versionen fest.", richtig: true }
        - { text: "Sie schützt die Datei vor Änderungen.", richtig: false }
        - { text: "Sie enthält den Quellcode der Pakete.", richtig: false }
    - frage: "Was bedeutet die Versionsangabe `^3.0`?"
      erklaerung: "Ab Version 3.0, aber unter 4.0."
      antworten:
        - { text: "Version 3.0 oder neuer, aber unter 4.0", richtig: true }
        - { text: "genau Version 3.0", richtig: false }
        - { text: "jede Version unter 3.0", richtig: false }
    - frage: "Was legt PSR-4 fest?"
      erklaerung: "Der Namespace entspricht dem Ordnerpfad, der Klassenname dem Dateinamen."
      antworten:
        - { text: "Namespace und Ordnerpfad entsprechen sich, damit Klassen automatisch gefunden werden.", richtig: true }
        - { text: "Wie Variablen benannt werden.", richtig: false }
        - { text: "Welche PHP-Version installiert sein muss.", richtig: false }
    - frage: "Welche Datei lädst du, damit Composer-Autoloading funktioniert?"
      erklaerung: "`vendor/autoload.php`."
      antworten:
        - { text: "vendor/autoload.php", richtig: true }
        - { text: "composer.json", richtig: false }
        - { text: "src/index.php", richtig: false }
    - frage: "Was solltest du bei einer eingebauten Klasse wie `Exception` innerhalb eines Namespace tun?"
      erklaerung: "Mit `use Exception;` oder `\\Exception` zeigst du PHP, dass die globale Klasse gemeint ist."
      antworten:
        - { text: 'use Exception; schreiben oder \Exception nutzen', richtig: true }
        - { text: "Nichts, sie wird immer gefunden.", richtig: false }
        - { text: "Die Klasse neu schreiben.", richtig: false }
