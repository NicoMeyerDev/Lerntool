titel: DevSecOps-Wiederholung
beschreibung: Die Themen aus deinem DevSecOps-Kurs noch einmal kurz und mit Quiz. Schwerpunkt auf Schutzzielen, Web-Schwachstellen, Passwörtern, Netzwerken, Linux, Cloud, Sicherheit in der Pipeline und Datenschutz. Praktische Labs sind nur Theorie und Quiz.
