titel: Sicherheit in der CI/CD-Pipeline
zusammenfassung: Du erinnerst dich an Shift-left und an die Prüfungen Secrets-Suche, SCA, SAST und DAST und daran, wo in der Pipeline sie ihren Platz haben.
quellen:
  - titel: OWASP DevSecOps Guideline
    url: https://owasp.github.io/www-project-devsecops-guideline/latest
  - titel: OWASP DevSecOps Guideline – Secrets Management
    url: https://owasp.github.io/www-project-devsecops-guideline/latest/01a-Secrets-Management
  - titel: OWASP DevSecOps Guideline – SAST
    url: https://owasp.github.io/www-project-devsecops-guideline/latest/02a-Static-Application-Security-Testing
  - titel: OWASP DevSecOps Guideline – DAST
    url: https://owasp.github.io/www-project-devsecops-guideline/latest/02b-Dynamic-Application-Security-Testing
  - titel: OWASP DevSecOps Guideline – Software Composition Analysis
    url: https://owasp.github.io/www-project-devsecops-guideline/latest/02d-Software-Composition-Analysis
abschnitte:
  - titel: Shift-left und die Pipeline
    inhalt: |
      Die OWASP-Guideline beschreibt, wie man eine sichere DevOps-Pipeline aufbaut. Das Ziel: Sicherheitsprobleme
      **so früh wie möglich** erkennen („shift-left“, also nach links, in Richtung Anfang der Entwicklung).

      Ihre Stufen sind unter anderem:

      - **Vor dem Commit (Pre-commit):** Secrets-Verwaltung und Linting.
      - **Schwachstellen-Prüfung:** SAST, DAST, IAST, SCA sowie Prüfung von Infrastruktur und Containern.
      - **Compliance-Prüfung.**
      - Dazu kommt die **Bedrohungsmodellierung** (Threat Modeling) schon beim Entwurf.

      **Bild (eigene Idee):** Ein Fehler beim Entwurf kostet einen Radiergummi. Derselbe Fehler im Betrieb kostet einen Umbau.
    quiz:
      - frage: "Was bedeutet Shift-left?"
        erklaerung: "Sicherheitsprüfungen so früh wie möglich in die Entwicklung verlegen."
        antworten:
          - { text: "Sicherheitsprüfungen erst nach dem Release im laufenden Betrieb durchführen.", richtig: false }
          - { text: "Den Server im Rechenzentrum an eine andere Stelle im Rack verschieben.", richtig: false }
          - { text: "Sicherheitsprüfungen so früh wie möglich in die Entwicklung verlegen.", richtig: true }
      - frage: "Was ist Threat Modeling?"
        erklaerung: "Bedrohungen schon beim Entwurf durchdenken."
        antworten:
          - { text: "Bedrohungen schon beim Entwurf durchdenken.", richtig: true }
          - { text: "Ein Test mit echten Angreifern am Release-Tag.", richtig: false }
          - { text: "Ein Werkzeug zum Komprimieren von Dateien.", richtig: false }
  - titel: Secrets-Suche und SCA
    inhalt: |
      **Secrets-Suche:** Gesucht wird nach Passwörtern, geheimen Schlüsseln und vertraulichen Daten in Commits und
      Repositories. Am besten **vor dem Commit** (Pre-commit), denn einmal committet, bleiben Geheimnisse in der
      Historie. Ein Beispiel für ein Werkzeug nach der Guideline ist `git-secrets`, das Commits mit Zugangsdaten
      blockiert. **Ein offengelegtes Geheimnis ist bereits kompromittiert:** Es muss ungültig gemacht werden.

      **SCA (Software Composition Analysis):** Verwaltet Fremd- und Open-Source-Bausteine im Projekt. Es findet
      **Abhängigkeiten**, **bekannte Schwachstellen** darin und liefert **Lizenzangaben**. Es soll früh laufen und
      die Bausteine dauerhaft beobachten. Das hilft gegen Angriffe über die Lieferkette (siehe OWASP Top 10, A03).
    quiz:
      - frage: "Warum sucht man nach Geheimnissen am besten vor dem Commit?"
        erklaerung: "Einmal committet, bleiben Geheimnisse in der Historie."
        antworten:
          - { text: "Weil Passwörter nur gelten, solange sie nicht committet wurden.", richtig: false }
          - { text: "Einmal committet, bleiben Geheimnisse in der Historie.", richtig: true }
          - { text: "Weil Git nach einem Commit mit Passwörtern nicht mehr funktioniert.", richtig: false }
      - frage: "Was liefert SCA laut Guideline?"
        erklaerung: "Abhängigkeiten, bekannte Schwachstellen und Lizenzangaben der Bausteine."
        antworten:
          - { text: "Einen Test, der simuliert, wie viele Nutzer gleichzeitig zugreifen können.", richtig: false }
          - { text: "Eine Übersicht über die Rechenzeit, die der Code beim Test verbraucht.", richtig: false }
          - { text: "Abhängigkeiten, bekannte Schwachstellen und Lizenzangaben der Bausteine.", richtig: true }
  - titel: SAST und DAST
    inhalt: |
      **SAST** (Static Application Security Testing) untersucht den **Quellcode, ohne das Programm auszuführen**
      (White-Box). Es meldet laut Guideline Syntaxverstöße, Sicherheitslücken, Programmierfehler und Verstöße
      gegen Programmierstandards. Es läuft oft als Teil einer Code-Prüfung.

      **DAST** (Dynamic Application Security Testing) testet die **laufende Anwendung** von außen (Black-Box),
      ohne Quellcode. Es schickt Angriffs-Eingaben und findet Schwächen wie SQL-Injection und XSS. Es eignet sich
      für Prüfungen von Ein- und Ausgaben, Anmeldeproblemen und Server-Konfigurationsfehlern und kann
      beispielsweise als nächtlicher Scan laufen.

      **Merksatz (eigene Idee):** SAST liest das Rezept, DAST probiert das fertige Gericht.

      **Wichtig (eigene Regel):** DAST darfst du nur gegen Systeme laufen lassen, die dir gehören oder für die du
      eine Erlaubnis hast (siehe Phase 1, § 202a StGB).
    quiz:
      - frage: "Was unterscheidet SAST von DAST?"
        erklaerung: "SAST untersucht den Code ohne ihn auszuführen, DAST testet die laufende Anwendung."
        antworten:
          - { text: "SAST untersucht den Code ohne ihn auszuführen, DAST testet die laufende Anwendung.", richtig: true }
          - { text: "SAST testet die laufende Anwendung, DAST liest den Quellcode.", richtig: false }
          - { text: "Beide untersuchen dasselbe, nur der Name der Werkzeuge ist verschieden.", richtig: false }
      - frage: "Welche Aussage über DAST ist laut Guideline richtig?"
        erklaerung: "Es braucht keinen Quellcode (Black-Box)."
        antworten:
          - { text: "Es funktioniert nur ohne laufende Anwendung.", richtig: false }
          - { text: "Es braucht keinen Quellcode (Black-Box).", richtig: true }
          - { text: "Es braucht den kompletten Quellcode.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Welche Prüfung gehört in die Stufe vor dem Commit?"
      erklaerung: "Die Suche nach Geheimnissen."
      antworten:
        - { text: "Der nächtliche DAST-Scan der Testumgebung", richtig: false }
        - { text: "Das Überwachen des Live-Systems", richtig: false }
        - { text: "Die Suche nach Geheimnissen", richtig: true }
    - frage: "Welche Prüfung findet bekannte Schwachstellen in Drittbibliotheken?"
      erklaerung: "SCA."
      antworten:
        - { text: "SCA", richtig: true }
        - { text: "Linting", richtig: false }
        - { text: "SAST", richtig: false }
    - frage: "Was ist mit einem Schlüssel zu tun, der versehentlich öffentlich geworden ist?"
      erklaerung: "Er gilt als kompromittiert und muss ungültig gemacht werden."
      antworten:
        - { text: "Es genügt, die betroffene Datei im nächsten Commit zu löschen.", richtig: false }
        - { text: "Er gilt als kompromittiert und muss ungültig gemacht werden.", richtig: true }
        - { text: "Nichts, denn die Historie eines Repositories ist immer privat.", richtig: false }
    - frage: "Welche Prüfung sieht den Quellcode, ohne das Programm zu starten?"
      erklaerung: "SAST."
      antworten:
        - { text: "Ein Lasttest", richtig: false }
        - { text: "DAST", richtig: false }
        - { text: "SAST", richtig: true }
    - frage: "Wogegen darfst du DAST nur einsetzen?"
      erklaerung: "Gegen Systeme, die dir gehören oder für die du eine Erlaubnis hast."
      antworten:
        - { text: "Gegen Systeme, die dir gehören oder für die du eine Erlaubnis hast.", richtig: true }
        - { text: "Gegen jede öffentlich erreichbare Seite, die im Internet gefunden wird.", richtig: false }
        - { text: "Gegen die Seiten von Mitbewerbern, um deren Schwächen zu kennen.", richtig: false }
