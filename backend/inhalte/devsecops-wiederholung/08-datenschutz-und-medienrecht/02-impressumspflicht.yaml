titel: Impressumspflicht nach § 5 DDG
zusammenfassung: Du erinnerst dich, wer ein Impressum braucht, welche Angaben es enthalten muss und wie es erreichbar sein soll.
quellen:
  - titel: Digitale-Dienste-Gesetz (DDG), § 5 Allgemeine Informationspflichten
    url: https://www.gesetze-im-internet.de/ddg/__5.html
abschnitte:
  - titel: Wer, was und wie
    inhalt: |
      § 5 DDG verpflichtet **Diensteanbieter geschäftsmäßiger digitaler Dienste, die in der Regel gegen Entgelt
      angeboten werden**, zu allgemeinen Informationen. Das ist die gesetzliche Grundlage für das **Impressum**
      (das Gesetz heißt Digitale-Dienste-Gesetz).

      **Pflichtangaben** (Abs. 1, Auswahl):

      - **Name und Anschrift** der Niederlassung. Bei juristischen Personen zusätzlich Rechtsform und vertretungsberechtigte Personen.
      - **Kontakt** für schnelle elektronische Kontaktaufnahme und direkte Kommunikation, **inklusive E-Mail-Adresse**.
      - Je nach Fall: Aufsichtsbehörde, Handelsregister mit Nummer, Kammer und Berufsbezeichnung, Umsatzsteuer-Identifikationsnummer.

      **Form:** Die Angaben müssen **leicht erkennbar, unmittelbar erreichbar und ständig verfügbar** sein.

      Ob **dein** Angebot ein Impressum braucht, hängt vom Einzelfall ab (zum Beispiel ob es gegen Entgelt angeboten
      wird). Das ist eine Rechtsfrage, die dieses Material nicht beantwortet.
    quiz:
      - frage: "Wie müssen die Impressumsangaben nach § 5 DDG bereitgehalten werden?"
        erklaerung: "Leicht erkennbar, unmittelbar erreichbar und ständig verfügbar."
        antworten:
          - { text: "Leicht erkennbar, unmittelbar erreichbar und ständig verfügbar.", richtig: true }
          - { text: "Nur auf Anfrage und dann per Post an die anfragende Person.", richtig: false }
          - { text: "Nur für Nutzer, die sich zuvor auf der Seite angemeldet haben.", richtig: false }
      - frage: "Welche Kontaktangabe nennt § 5 DDG ausdrücklich?"
        erklaerung: "Eine E-Mail-Adresse."
        antworten:
          - { text: "Die Steuernummer des Unternehmens.", richtig: false }
          - { text: "Eine E-Mail-Adresse.", richtig: true }
          - { text: "Die private Handynummer der Geschäftsleitung.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Wie heißt das Gesetz, in dem die Impressumspflicht heute steht?"
      erklaerung: "Digitale-Dienste-Gesetz (DDG)."
      antworten:
        - { text: "Bundesdatenschutzgesetz (BDSG)", richtig: false }
        - { text: "Telekommunikationsgesetz (TKG)", richtig: false }
        - { text: "Digitale-Dienste-Gesetz (DDG)", richtig: true }
    - frage: "Welche Angabe gehört bei juristischen Personen zusätzlich ins Impressum?"
      erklaerung: "Rechtsform und vertretungsberechtigte Personen."
      antworten:
        - { text: "Rechtsform und vertretungsberechtigte Personen", richtig: true }
        - { text: "Die Anzahl der Mitarbeitenden", richtig: false }
        - { text: "Der Jahresumsatz des Unternehmens", richtig: false }
    - frage: "Auf wen zielt § 5 DDG laut Gesetzestext?"
      erklaerung: "Auf Diensteanbieter geschäftsmäßiger digitaler Dienste, die in der Regel gegen Entgelt angeboten werden."
      antworten:
        - { text: "Ausschließlich auf Behörden und öffentliche Einrichtungen des Bundes.", richtig: false }
        - { text: "Auf Diensteanbieter geschäftsmäßiger digitaler Dienste, die in der Regel gegen Entgelt angeboten werden.", richtig: true }
        - { text: "Auf alle Privatpersonen, die einen Computer oder ein Handy besitzen.", richtig: false }
    - frage: "Wann müssen die Angaben verfügbar sein?"
      erklaerung: "Ständig."
      antworten:
        - { text: "Nur nach vorheriger Anmeldung", richtig: false }
        - { text: "Nur während der üblichen Geschäftszeiten", richtig: false }
        - { text: "Ständig", richtig: true }
    - frage: "Warum ersetzt dieses Material keine Rechtsberatung?"
      erklaerung: "Ob ein Impressum nötig ist, hängt vom Einzelfall ab."
      antworten:
        - { text: "Ob ein Impressum nötig ist, hängt vom Einzelfall ab.", richtig: true }
        - { text: "Weil Impressumspflichten ausschließlich für Behörden gelten.", richtig: false }
        - { text: "Weil Rechtsberatung grundsätzlich nur online angeboten werden darf.", richtig: false }
