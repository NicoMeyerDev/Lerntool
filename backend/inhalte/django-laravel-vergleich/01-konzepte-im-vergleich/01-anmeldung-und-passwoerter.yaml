titel: Anmeldung und Passwörter
zusammenfassung: Du erinnerst dich, wie Django und Laravel Nutzer anmelden, Seiten schützen und Passwörter nur als Hash speichern.
quellen:
  - titel: Django 5.2 – Authentifizierung
    url: https://docs.djangoproject.com/en/5.2/topics/auth/
  - titel: Django 5.2 – Authentifizierung im Standardsystem
    url: https://docs.djangoproject.com/en/5.2/topics/auth/default/
  - titel: Django 5.2 – Passwortverwaltung
    url: https://docs.djangoproject.com/en/5.2/topics/auth/passwords/
  - titel: Laravel 13.x – Authentifizierung
    url: https://laravel.com/docs/13.x/authentication
  - titel: Laravel 13.x – Hashing
    url: https://laravel.com/docs/13.x/hashing
  - titel: Laravel 13.x – Sanctum
    url: https://laravel.com/docs/13.x/sanctum
abschnitte:
  - titel: Gleiche Idee, zwei Namen
    inhalt: |
      Beide Frameworks bringen eine fertige Anmeldung mit. Du musst sie nicht selbst erfinden.

      | Aufgabe | Django | Laravel |
      | --- | --- | --- |
      | Nutzer prüfen und anmelden | `authenticate()` und `login()` | `Auth`-Fassade, zum Beispiel `Auth::attempt()` |
      | Seite nur für Angemeldete | `@login_required` oder Mixin | Middleware `auth` |
      | Passwort speichern | `make_password()`, Standard-Verfahren PBKDF2 | `Hash::make()`, laut Doku standardmäßig bcrypt |

      **Gemeinsame Idee:** Das Passwort wird nie im Klartext gespeichert, sondern als **Hash** mit Salz. Beim
      Anmelden wird das eingegebene Passwort gehasht und mit dem gespeicherten Wert verglichen.

      Die Doku nennt die Standard-Verfahren. Welche Einstellung bei dir aktiv ist, steht in der Konfiguration deines
      Projekts. Prüfe sie dort, statt dich auf eine Annahme zu verlassen.
    quiz:
      - frage: "Was haben Django und Laravel bei Passwörtern gemeinsam?"
        erklaerung: "Beide speichern Passwörter als Hash und nicht im Klartext."
        antworten:
          - { text: "Beide speichern Passwörter als Hash und nicht im Klartext.", richtig: true }
          - { text: "Beide überlassen das Speichern der Passwörter dem Browser der Nutzer.", richtig: false }
          - { text: "Beide speichern Passwörter verschlüsselt, damit sie bei Bedarf wieder lesbar sind.", richtig: false }
      - frage: "Welches Laravel-Mittel entspricht dem Django-Dekorator @login_required?"
        erklaerung: "Die Middleware auth lässt nur angemeldete Nutzer durch."
        antworten:
          - { text: "Die Fassade Hash, die Passwörter prüft und erzeugt.", richtig: false }
          - { text: "Die Middleware auth.", richtig: true }
          - { text: "Die CSRF-Middleware, die Formulare mit einem Token schützt.", richtig: false }
  - titel: Anmeldung für APIs
    inhalt: |
      Eine reine API hat oft keinen Browser mit Sitzung. Dafür gibt es eigene Wege:

      - **Laravel Sanctum** bietet laut Doku zwei Dinge: Tokens für APIs und eine Anmeldung für
        Single-Page-Anwendungen (SPA).
      - In **Django REST Framework** wählst du eine Authentifizierungsklasse, zum Beispiel Sitzung oder Token.

      **Gemeinsame Idee:** Jede Anfrage muss sich ausweisen, und die Schutzschicht prüft das, bevor der eigentliche
      Code läuft.

      **Sicherheitsregel:** Ein Token ist wie ein Passwort. Er gehört nie in den Code oder ins Repository, sondern in
      eine Umgebungsvariable oder einen Geheimnisspeicher.
    quiz:
      - frage: "Was bietet Laravel Sanctum laut Doku?"
        erklaerung: "API-Tokens und eine Anmeldung für Single-Page-Anwendungen."
        antworten:
          - { text: "Ein Verfahren, das Passwörter mit bcrypt hasht und prüft.", richtig: false }
          - { text: "Ein Test-Framework, das API-Anfragen simuliert.", richtig: false }
          - { text: "API-Tokens und eine Anmeldung für Single-Page-Anwendungen.", richtig: true }
      - frage: "Wo gehört ein API-Token hin?"
        erklaerung: "In eine Umgebungsvariable oder einen Geheimnisspeicher, nie ins Repository."
        antworten:
          - { text: "In eine Umgebungsvariable oder einen Geheimnisspeicher.", richtig: true }
          - { text: "Fest in den Quellcode, damit er beim Start immer verfügbar ist.", richtig: false }
          - { text: "In eine Konfigurationsdatei, die im Repository mit eingecheckt wird.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Welche Django-Funktion hasht ein Passwort?"
      erklaerung: "make_password()."
      antworten:
        - { text: "login()", richtig: false }
        - { text: "make_password()", richtig: true }
        - { text: "logout()", richtig: false }
    - frage: "Wie heißt die Laravel-Fassade zum Hashen?"
      erklaerung: "Hash, zum Beispiel Hash::make()."
      antworten:
        - { text: "Route", richtig: false }
        - { text: "Cache", richtig: false }
        - { text: "Hash", richtig: true }
    - frage: "Warum speichert man Passwörter als Hash?"
      erklaerung: "Auch bei einem Datenbank-Leck liegt kein Klartext-Passwort vor."
      antworten:
        - { text: "Auch bei einem Datenbank-Leck liegt kein Klartext-Passwort vor.", richtig: true }
        - { text: "Weil ein Hash das Passwort automatisch länger und damit nicht mehr erratbar macht.", richtig: false }
        - { text: "Weil sich ein Hash bei jeder Anmeldung wieder in das Passwort zurückrechnen lässt.", richtig: false }
    - frage: "Woher weißt du, welches Hash-Verfahren dein Projekt nutzt?"
      erklaerung: "Aus der Konfiguration des Projekts und der Doku, nicht aus einer Annahme."
      antworten:
        - { text: "Aus der Version des Browsers, mit dem sich die Nutzer anmelden.", richtig: false }
        - { text: "Aus der Konfiguration des Projekts und der Doku.", richtig: true }
        - { text: "Es ist in allen Django- und Laravel-Projekten und Versionen gleich.", richtig: false }
    - frage: "Was prüft die Anmeldung beim Vergleich des eingegebenen Passworts?"
      erklaerung: "Das eingegebene Passwort wird gehasht und mit dem gespeicherten Hash verglichen."
      antworten:
        - { text: "Das Passwort wird an den Nutzer zurückgeschickt und dort bestätigt.", richtig: false }
        - { text: "Der gespeicherte Hash wird entschlüsselt und mit dem eingegebenen Passwort verglichen.", richtig: false }
        - { text: "Das eingegebene Passwort wird gehasht und mit dem gespeicherten Hash verglichen.", richtig: true }
