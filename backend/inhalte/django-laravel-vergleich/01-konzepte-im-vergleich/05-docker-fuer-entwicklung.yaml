titel: Docker für die Entwicklung
zusammenfassung: Du erinnerst dich, wie du eine Django-App selbst in einen Container packst und was Laravel Sail dir an Docker-Arbeit abnimmt.
quellen:
  - titel: Docker – Python-Anwendung containerisieren
    url: https://docs.docker.com/guides/python/containerize/
  - titel: Laravel 13.x – Sail
    url: https://laravel.com/docs/13.x/sail
abschnitte:
  - titel: Zwei Wege zum Container
    inhalt: |
      Ein **Container** bündelt Anwendung und Umgebung, damit sie überall gleich läuft.

      - **Django:** Du schreibst typischerweise selbst ein `Dockerfile` (Basis-Image, Abhängigkeiten installieren,
        Code kopieren, Startbefehl). Die Docker-Anleitung für Python zeigt diesen Weg.
      - **Laravel:** **Sail** ist laut Doku eine Kommandozeilen-Oberfläche für Laravels Docker-Entwicklungsumgebung.
        Du startest sie mit einem Befehl, statt jede Datei selbst zu schreiben.

      **Gemeinsame Idee:** Dieselbe Umgebung für alle Entwickler, beschrieben in Dateien, die im Repository liegen.

      **Unterschied:** Bei Django baust du die Umgebung selbst, bei Laravel liefert Sail eine fertige. Ein
      Beispiel-Dockerfile für Django findest du in der Docker-Anleitung. Wie es bei deinem Projekt aussieht, hängt
      von dessen Anforderungen ab.
    quiz:
      - frage: "Was bündelt ein Container?"
        erklaerung: "Die Anwendung und ihre Umgebung."
        antworten:
          - { text: "Die Anwendung und ihre Umgebung.", richtig: true }
          - { text: "Nur das Betriebssystem des Entwicklungsrechners.", richtig: false }
          - { text: "Nur den Quellcode, ohne Abhängigkeiten und Einstellungen.", richtig: false }
      - frage: "Was ist Laravel Sail laut Doku?"
        erklaerung: "Eine Kommandozeilen-Oberfläche für Laravels Docker-Entwicklungsumgebung."
        antworten:
          - { text: "Ein Test-Framework für Laravel-Anwendungen.", richtig: false }
          - { text: "Eine Kommandozeilen-Oberfläche für Laravels Docker-Entwicklungsumgebung.", richtig: true }
          - { text: "Ein Paketmanager für PHP-Abhängigkeiten.", richtig: false }
  - titel: Geheimnisse gehören nicht ins Image
    inhalt: |
      Ein Image enthält alles, was beim Bauen hineinkommt. Landet dort ein Passwort, ist es für jeden sichtbar,
      der das Image bekommt.

      - Zugangsdaten kommen zur Laufzeit über **Umgebungsvariablen** oder einen Geheimnisspeicher.
      - Die `.env`-Datei gehört nicht ins Image und nicht ins Repository.
      - Eine `.dockerignore` hält unnötige oder geheime Dateien aus dem Build heraus.

      **Gemeinsame Idee:** Konfiguration und Code getrennt halten, in Django wie in Laravel.
    quiz:
      - frage: "Wie kommen Zugangsdaten in einen Container?"
        erklaerung: "Zur Laufzeit über Umgebungsvariablen oder einen Geheimnisspeicher."
        antworten:
          - { text: "Fest im Dockerfile eingetragen, damit sie beim Bau schon vorhanden sind.", richtig: false }
          - { text: "In der README des Projekts, damit das Team sie findet.", richtig: false }
          - { text: "Zur Laufzeit über Umgebungsvariablen oder einen Geheimnisspeicher.", richtig: true }
      - frage: "Wozu dient eine .dockerignore?"
        erklaerung: "Sie hält unnötige oder geheime Dateien aus dem Build heraus."
        antworten:
          - { text: "Sie hält unnötige oder geheime Dateien aus dem Build heraus.", richtig: true }
          - { text: "Sie beschränkt die Rechenleistung eines laufenden Containers.", richtig: false }
          - { text: "Sie legt fest, welche Container beim Start automatisch laufen.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Welche Datei beschreibt bei Django meist den Bau des Images?"
      erklaerung: "Das Dockerfile."
      antworten:
        - { text: "Die Datei requirements.txt", richtig: false }
        - { text: "Das Dockerfile", richtig: true }
        - { text: "Die Datei models.py", richtig: false }
    - frage: "Was ist ein Unterschied zwischen Django-Docker und Sail?"
      erklaerung: "Bei Django baust du die Umgebung selbst, bei Laravel liefert Sail eine fertige."
      antworten:
        - { text: "Django kennt kein Docker, Laravel schon.", richtig: false }
        - { text: "Sail ist ein Werkzeug, das nur für Python-Projekte gebaut wurde.", richtig: false }
        - { text: "Bei Django baust du die Umgebung selbst, bei Laravel liefert Sail eine fertige.", richtig: true }
    - frage: "Warum gehört die .env-Datei nicht ins Image?"
      erklaerung: "Sonst wären die Geheimnisse für jeden sichtbar, der das Image bekommt."
      antworten:
        - { text: "Sonst wären die Geheimnisse für jeden sichtbar, der das Image bekommt.", richtig: true }
        - { text: "Weil Docker keine Dateien lesen kann, die mit einem Punkt beginnen.", richtig: false }
        - { text: "Weil die Datei das Image unnötig groß machen würde.", richtig: false }
    - frage: "Was ist die gemeinsame Idee hinter Containern?"
      erklaerung: "Dieselbe Umgebung für alle, beschrieben in Dateien im Repository."
      antworten:
        - { text: "Die Umgebung wird mündlich weitergegeben und von Hand nachgebaut.", richtig: false }
        - { text: "Dieselbe Umgebung für alle, beschrieben in Dateien im Repository.", richtig: true }
        - { text: "Jeder Entwickler richtet seine Umgebung nach eigenem Geschmack ein.", richtig: false }
    - frage: "Was gehört typischerweise in ein Dockerfile für eine Python-Anwendung?"
      erklaerung: "Basis-Image, Abhängigkeiten installieren, Code kopieren und Startbefehl."
      antworten:
        - { text: "Die Zugangsdaten aller Nutzer, damit die Anwendung sie kennt.", richtig: false }
        - { text: "Nur die Lizenz und die README des Projekts.", richtig: false }
        - { text: "Basis-Image, Abhängigkeiten installieren, Code kopieren und Startbefehl.", richtig: true }
