titel: Tests schreiben
zusammenfassung: Du erinnerst dich, wie Django und Laravel Tests ausführen, mit einer Test-Datenbank arbeiten und HTTP-Anfragen simulieren.
quellen:
  - titel: Django 5.2 – Testen in Django
    url: https://docs.djangoproject.com/en/5.2/topics/testing/overview/
  - titel: Laravel 13.x – Testing, Einstieg
    url: https://laravel.com/docs/13.x/testing
  - titel: Laravel 13.x – HTTP-Tests
    url: https://laravel.com/docs/13.x/http-tests
abschnitte:
  - titel: Tests laufen lassen
    inhalt: |
      | Aufgabe | Django | Laravel |
      | --- | --- | --- |
      | Tests starten | `python manage.py test` (in diesem Projekt: `pytest`) | `php artisan test` |
      | Anfrage simulieren | Test-Client (`self.client.get(...)`) | `$this->get(...)` in HTTP-Tests |
      | Datenbank | Django legt für Tests eine eigene Test-Datenbank an | Laravel nutzt für Tests die Testumgebung und ihre Konfiguration (Details in der Doku) |

      **Gemeinsame Idee:** Ein Test arbeitet nie mit deinen echten Daten. Er baut sich seinen Zustand selbst auf,
      führt eine Aktion aus und prüft das Ergebnis (**Arrange, Act, Assert**).

      Die Details der Test-Datenbank unterscheiden sich je nach Konfiguration. Lies dazu die Doku deiner Version.
    quiz:
      - frage: "Welche drei Schritte hat ein typischer Test?"
        erklaerung: "Zustand vorbereiten, Aktion ausführen, Ergebnis prüfen."
        antworten:
          - { text: "Zustand vorbereiten, Aktion ausführen, Ergebnis prüfen.", richtig: true }
          - { text: "Code schreiben, Code veröffentlichen, Rückmeldung sammeln.", richtig: false }
          - { text: "Datenbank leeren, Server starten, Seite aufrufen.", richtig: false }
      - frage: "Womit startest du die Tests in Laravel?"
        erklaerung: "Mit php artisan test."
        antworten:
          - { text: "Mit python manage.py test.", richtig: false }
          - { text: "Mit php artisan test.", richtig: true }
          - { text: "Mit php artisan migrate.", richtig: false }
  - titel: Was du testest
    inhalt: |
      - **Einheitstests** prüfen kleine Bausteine, zum Beispiel eine Funktion im Service.
      - **Funktionstests** (HTTP-Tests) prüfen eine Route von der Anfrage bis zur Antwort, inklusive Statuscode.

      **Gemeinsame Idee:** Teste Verhalten, das für Nutzer wichtig ist, und auch Fehlerfälle wie falsche Eingaben
      oder fehlende Anmeldung.

      **Sicherheit:** Nutze in Tests erfundene Beispieldaten und niemals echte Passwörter oder Tokens.
    quiz:
      - frage: "Was prüft ein HTTP-Test?"
        erklaerung: "Eine Route von der Anfrage bis zur Antwort."
        antworten:
          - { text: "Nur die Darstellung der Seite im Browser, nicht die Antwort.", richtig: false }
          - { text: "Nur die Funktionsweise einer einzelnen Funktion ohne Anfrage.", richtig: false }
          - { text: "Eine Route von der Anfrage bis zur Antwort.", richtig: true }
      - frage: "Welche Daten gehören in Tests?"
        erklaerung: "Erfundene Beispieldaten, keine echten Passwörter oder Tokens."
        antworten:
          - { text: "Erfundene Beispieldaten.", richtig: true }
          - { text: "Kopien der echten Kundendaten aus dem Produktivsystem.", richtig: false }
          - { text: "Das echte Admin-Passwort, damit die Anmeldung getestet werden kann.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Wozu dient der Django-Test-Client?"
      erklaerung: "Er simuliert Anfragen an die Anwendung."
      antworten:
        - { text: "Er installiert die Abhängigkeiten, die der Test braucht.", richtig: false }
        - { text: "Er simuliert Anfragen an die Anwendung.", richtig: true }
        - { text: "Er baut die Docker-Images für die Testumgebung.", richtig: false }
    - frage: "Was bedeutet das Muster Arrange, Act, Assert?"
      erklaerung: "Vorbereiten, ausführen, prüfen."
      antworten:
        - { text: "Anlegen, Archivieren, Auswerten", richtig: false }
        - { text: "Planen, Programmieren, Ausliefern", richtig: false }
        - { text: "Vorbereiten, ausführen, prüfen", richtig: true }
    - frage: "Warum testet man auch Fehlerfälle?"
      erklaerung: "Weil falsche Eingaben und fehlende Anmeldung im Alltag vorkommen."
      antworten:
        - { text: "Weil falsche Eingaben und fehlende Anmeldung im Alltag vorkommen.", richtig: true }
        - { text: "Weil Fehlerfälle in der Praxis nie vorkommen und nur theoretisch sind.", richtig: false }
        - { text: "Weil Frameworks Fehlerfälle automatisch abdecken und nicht testen müssen.", richtig: false }
    - frage: "Arbeitet ein Test mit den echten Produktivdaten?"
      erklaerung: "Nein, er baut seinen Zustand selbst auf."
      antworten:
        - { text: "Ja, aber nur lesend, damit nichts verändert wird.", richtig: false }
        - { text: "Nein, er baut seinen Zustand selbst auf.", richtig: true }
        - { text: "Ja, damit der Test möglichst echte Daten verwendet.", richtig: false }
    - frage: "Was prüft ein Einheitstest?"
      erklaerung: "Einen kleinen Baustein, zum Beispiel eine Funktion im Service."
      antworten:
        - { text: "Eine Route von der Anfrage bis zur Antwort im Browser.", richtig: false }
        - { text: "Das Zusammenspiel aller Dienste der fertigen Anwendung.", richtig: false }
        - { text: "Einen kleinen Baustein, zum Beispiel eine Funktion im Service.", richtig: true }
