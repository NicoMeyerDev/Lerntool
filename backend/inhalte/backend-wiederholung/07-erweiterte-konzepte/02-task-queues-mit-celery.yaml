titel: Task-Queues mit Celery
zusammenfassung: Du erinnerst dich, wofür Task-Queues da sind, welche Rollen Broker, Worker und Task haben und wie Celery in Django eingebunden wird.
quellen:
  - titel: Celery – Einführung
    url: https://docs.celeryq.dev/en/stable/getting-started/introduction.html
  - titel: Celery – Erste Schritte mit Django
    url: https://docs.celeryq.dev/en/stable/django/first-steps-with-django.html
abschnitte:
  - titel: Das Prinzip der Task-Queue
    inhalt: |
      **Celery** arbeitet mit **Task-Queues**. Die Doku erklärt sie als Mechanismus, um Arbeit auf Threads oder Rechner zu verteilen.
      Die Rollen:

      - **Task:** eine Arbeitseinheit, die in die Warteschlange gestellt wird.
      - **Broker:** vermittelt die Nachrichten zwischen Client und Worker. Die Doku nennt RabbitMQ und
        Redis als vollständig unterstützt.
      - **Worker:** Prozesse, die die Warteschlange beobachten und Tasks ausführen.

      **Bild (eigene Idee):** Ein Restaurant. Der Kellner (deine Web-App) nimmt die Bestellung auf und
      hängt den Zettel an die Leiste (Broker). Die Köche (Worker) holen sich Zettel. Der Gast muss nicht
      am Herd warten.

      Dafür eignen sich langsame Dinge wie E-Mails, Berichte oder Datenimport. Die Doku nennt außerdem
      zeitgesteuerte Tasks. Hinweis der Doku: Celery wird wegen geringer Förderung nicht offiziell für Microsoft Windows unterstützt. (Eigene Empfehlung, weil du unter Windows arbeitest: Plane den Worker lieber in einer Linux-Umgebung, zum Beispiel WSL oder Docker.)
    quiz:
      - frage: "Was macht der Broker bei Celery?"
        erklaerung: "Er vermittelt die Nachrichten zwischen Client und Worker."
        antworten:
          - { text: "Er führt die Tasks selbst aus.", richtig: false }
          - { text: "Er vermittelt die Nachrichten zwischen Client und Worker.", richtig: true }
          - { text: "Er speichert die Webseite.", richtig: false }
      - frage: "Welche Aufgabe gehört in eine Task-Queue?"
        erklaerung: "Eine langsame Arbeit wie ein umfangreicher Bericht, damit die Anfrage nicht blockiert."
        antworten:
          - { text: "Das Anzeigen einer Überschrift.", richtig: false }
          - { text: "Das Setzen eines Cookies.", richtig: false }
          - { text: "Eine langsame Arbeit wie ein umfangreicher Bericht, damit die Anfrage nicht blockiert.", richtig: true }
  - titel: Celery in Django einbinden
    inhalt: |
      Die Doku beschreibt diese Schritte:

      1. `proj/proj/celery.py` legt die App an:

         ```python
         import os
         from celery import Celery

         os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'proj.settings')
         app = Celery('proj')
         app.config_from_object('django.conf:settings', namespace='CELERY')
         app.autodiscover_tasks()
         ```

      2. In `proj/proj/__init__.py` wird die App beim Start geladen (`from .celery import app as celery_app`).
      3. Celery-Einstellungen in `settings.py` tragen das Präfix `CELERY_`.
      4. Tasks stehen in `tasks.py` der Apps und werden mit `@shared_task` markiert.
      5. Aufruf mit `add.delay(2, 3)`: Die Task wandert in die Warteschlange.
      6. Worker starten: `celery -A proj worker -l INFO`.

      Rufst du eine Task in einer Datenbank-Transaktion auf, nutze `delay_on_commit()`. Dann wird sie erst
      nach dem Commit gesendet (verfügbar seit Celery 5.4). Eine Task-ID gibt `delay_on_commit()` nicht zurück, dafür brauchst du `delay()`.
    quiz:
      - frage: "Wie stellst du eine Task in die Warteschlange?"
        erklaerung: "Mit task.delay(...)."
        antworten:
          - { text: "Mit task.delay(...)", richtig: true }
          - { text: "Mit task.delete()", richtig: false }
          - { text: "Mit task.stop()", richtig: false }
      - frage: "Wozu dient `delay_on_commit()`?"
        erklaerung: "Die Task wird erst gesendet, wenn die Datenbank-Transaktion abgeschlossen ist."
        antworten:
          - { text: "Die Task wird erst gesendet, wenn die Datenbank-Transaktion abgeschlossen ist.", richtig: true }
          - { text: "Die Task läuft doppelt.", richtig: false }
          - { text: "Die Task wird gelöscht.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Welche Aufgabe haben Worker?"
      erklaerung: "Sie beobachten die Warteschlange und führen Tasks aus."
      antworten:
        - { text: "Sie beobachten die Warteschlange und führen Tasks aus.", richtig: true }
        - { text: "Sie verwalten Git-Branches.", richtig: false }
        - { text: "Sie zeigen HTML an.", richtig: false }
    - frage: "Mit welchem Dekorator wird in einer wiederverwendbaren App eine Task markiert?"
      erklaerung: "@shared_task."
      antworten:
        - { text: "@cache_page", richtig: false }
        - { text: "@login_required", richtig: false }
        - { text: "@shared_task", richtig: true }
    - frage: "Welches Präfix tragen Celery-Einstellungen in `settings.py` bei `namespace='CELERY'`?"
      erklaerung: "CELERY_."
      antworten:
        - { text: "DJANGO_", richtig: false }
        - { text: "CELERY_", richtig: true }
        - { text: "TASK_", richtig: false }
    - frage: "Wie startest du laut Doku einen Worker?"
      erklaerung: "Mit celery -A proj worker -l INFO."
      antworten:
        - { text: "python manage.py worker", richtig: false }
        - { text: "celery -A proj worker -l INFO", richtig: true }
        - { text: "pytest worker", richtig: false }
    - frage: "Welche Broker nennt die Doku als vollständig unterstützt?"
      erklaerung: "RabbitMQ und Redis."
      antworten:
        - { text: "Nur SQLite", richtig: false }
        - { text: "RabbitMQ und Redis", richtig: true }
        - { text: "Nur Git", richtig: false }
