titel: Pagination, Filter und Suche
zusammenfassung: Du erinnerst dich an die drei Pagination-Arten, an die Einstellungen PAGE_SIZE und DEFAULT_PAGINATION_CLASS sowie an Filter, Suche und Sortierung.
quellen:
  - titel: Django REST Framework – Pagination
    url: https://www.django-rest-framework.org/api-guide/pagination/
  - titel: Django REST Framework – Filtering
    url: https://www.django-rest-framework.org/api-guide/filtering/
abschnitte:
  - titel: Pagination
    inhalt: |
      **Pagination** teilt lange Listen in Seiten. (Eigene Erklärung: So bleiben die Antworten
      klein.)

      DRF bringt drei Arten mit:

      - **PageNumberPagination:** `?page=4`. Die Antwort enthält `count`, `next`, `previous` und `results`.
      - **LimitOffsetPagination:** `?limit=100&offset=400`. `limit` ist die Höchstzahl, `offset` der Startpunkt.
      - **CursorPagination:** mit einem undurchsichtigen Cursor, nur vor und zurück, kein Sprung zu beliebigen Positionen.

      **Einstellen** in `settings.py`:

      ```python
      REST_FRAMEWORK = {
          'DEFAULT_PAGINATION_CLASS': 'rest_framework.pagination.LimitOffsetPagination',
          'PAGE_SIZE': 100
      }
      ```

      Beide Werte sind standardmäßig `None`, also gibt es ohne Einstellung keine Pagination. Pro
      View kannst du `pagination_class` setzen, mit `None` schaltest du sie dort ab.
    quiz:
      - frage: "Welche Schlüssel hat die Antwort bei PageNumberPagination?"
        erklaerung: "count, next, previous und results."
        antworten:
          - { text: "page, size, total", richtig: false }
          - { text: "data, error, status", richtig: false }
          - { text: "count, next, previous, results", richtig: true }
      - frage: "Was gilt, wenn DEFAULT_PAGINATION_CLASS und PAGE_SIZE nicht gesetzt sind?"
        erklaerung: "Beide sind standardmäßig None, es gibt keine Pagination."
        antworten:
          - { text: "DRF startet nicht.", richtig: false }
          - { text: "Es gibt keine Pagination.", richtig: true }
          - { text: "Die Seitengröße ist immer 10.", richtig: false }
  - titel: Die Reihenfolge nicht vergessen
    inhalt: |
      Eine saubere Pagination braucht eine **feste Reihenfolge** der Daten. Setze sie über `Meta`
      `ordering` am Modell, über `order_by` am QuerySet oder über den `OrderingFilter`.

      Ist die Reihenfolge schwach, können die Ergebnisse nach Aussage der Doku suboptimal oder
      schlicht inkonsistent sein, mit fehlenden oder doppelten Einträgen.

      Für die Sortierspalte nennt die Doku diese Wünsche: unveränderlich, eindeutig (bei Cursors
      zumindest fast), nicht leer, keine Fließkommazahl und mit Index.

      Die **CursorPagination** sortiert standardmäßig nach `-created` und setzt dann ein Feld
      `created` voraus, solange du keine eigene Sortierung (`ordering`) einstellst.
    quiz:
      - frage: "Warum braucht Pagination eine feste Reihenfolge?"
        erklaerung: "Sonst können Einträge fehlen oder doppelt erscheinen."
        antworten:
          - { text: "Sonst gibt es keine JSON-Antwort.", richtig: false }
          - { text: "Sonst können Einträge fehlen oder doppelt erscheinen.", richtig: true }
          - { text: "Sonst läuft der Server langsamer als 1 Sekunde.", richtig: false }
      - frage: "Nach welchem Feld sortiert die CursorPagination standardmäßig?"
        erklaerung: "Standardmäßig wird nach -created sortiert, solange keine eigene Sortierung eingestellt ist."
        antworten:
          - { text: "created", richtig: true }
          - { text: "updated", richtig: false }
          - { text: "name", richtig: false }
  - titel: Filter, Suche und Sortierung
    inhalt: |
      **Nach dem aktuellen Nutzer:** In `get_queryset()` filterst du auf `request.user`, damit
      jemand nur eigene Datensätze sieht:

      ```python
      return Purchase.objects.filter(purchaser=user)
      ```

      **Nach Abfrageparametern:** In `get_queryset()` liest du `self.request.query_params` und
      filterst nur, wenn der Parameter da ist (zum Beispiel `?username=...`).

      **Filter-Backends** (global über `DEFAULT_FILTER_BACKENDS` oder pro View):

      - **DjangoFilterBackend** (Paket `django-filter`, App `django_filters`): einfache Gleichheitsfilter
        mit `filterset_fields = ['category', 'in_stock']`, Aufruf `?category=clothing&in_stock=True`.
      - **SearchFilter:** wirkt nur, wenn die View `search_fields` setzt. Aufruf `?search=russell`.
        Standard ist eine Teilübereinstimmung ohne Beachtung der Groß-/Kleinschreibung.
      - **OrderingFilter:** `?ordering=username`, rückwärts `?ordering=-username`. Mit
        `ordering_fields` begrenzt du die erlaubten Felder, mit `ordering` setzt du die
        Standard-Sortierung.
    quiz:
      - frage: "Wie sortierst du absteigend nach username mit dem OrderingFilter?"
        erklaerung: "Mit einem Minuszeichen: ?ordering=-username."
        antworten:
          - { text: "?desc=username", richtig: false }
          - { text: "?ordering=-username", richtig: true }
          - { text: "?sort=username", richtig: false }
      - frage: "Wann wirkt der SearchFilter?"
        erklaerung: "Nur wenn die View search_fields gesetzt hat."
        antworten:
          - { text: "Nur bei LimitOffsetPagination.", richtig: false }
          - { text: "Nur wenn die View search_fields setzt.", richtig: true }
          - { text: "Immer, auf alle Felder.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Wozu dient Pagination in einer API?"
      erklaerung: "Sie teilt lange Listen in Seiten auf."
      antworten:
        - { text: "Sie teilt lange Listen in Seiten auf.", richtig: true }
        - { text: "Sie verschlüsselt die Antwort.", richtig: false }
        - { text: "Sie prüft Passwörter.", richtig: false }
    - frage: "Welche Parameter nutzt LimitOffsetPagination?"
      erklaerung: "limit und offset."
      antworten:
        - { text: "start und end", richtig: false }
        - { text: "limit und offset", richtig: true }
        - { text: "page und size", richtig: false }
    - frage: "Was ist die Besonderheit der CursorPagination?"
      erklaerung: "Der Client kann nicht zu beliebigen Positionen springen, nur vor und zurück."
      antworten:
        - { text: "Sie funktioniert ohne Reihenfolge.", richtig: false }
        - { text: "Sie ersetzt die Datenbank.", richtig: false }
        - { text: "Der Client kann nur vor und zurück blättern.", richtig: true }
    - frage: "Wo setzt du global die Pagination-Klasse?"
      erklaerung: "In den REST_FRAMEWORK-Einstellungen mit DEFAULT_PAGINATION_CLASS."
      antworten:
        - { text: "In REST_FRAMEWORK mit DEFAULT_PAGINATION_CLASS", richtig: true }
        - { text: "In der Datei manage.py", richtig: false }
        - { text: "Im Template", richtig: false }
    - frage: "Wie erlaubst du dem OrderingFilter nur bestimmte Felder?"
      erklaerung: "Mit ordering_fields."
      antworten:
        - { text: "Mit search_fields", richtig: false }
        - { text: "Mit filterset_fields", richtig: false }
        - { text: "Mit ordering_fields", richtig: true }
