titel: Serializer
zusammenfassung: Du erinnerst dich, wie Serializer Daten in Python-Typen umwandeln und Eingaben prüfen, wie ModelSerializer Felder erzeugt und wie du Feld- und Objektprüfungen schreibst.
quellen:
  - titel: Django REST Framework – Serializers
    url: https://www.django-rest-framework.org/api-guide/serializers/
abschnitte:
  - titel: Was ein Serializer macht
    inhalt: |
      Ein **Serializer** wandelt komplexe Daten wie Modell-Objekte und QuerySets in einfache
      Python-Typen um. Die lassen sich dann als JSON ausgeben. Umgekehrt prüft er eingehende Daten
      und macht daraus wieder Python-Objekte.

      Ein Serializer sieht aus wie ein Django-Formular:

      ```python
      from rest_framework import serializers

      class CommentSerializer(serializers.Serializer):
          email = serializers.EmailField()
          content = serializers.CharField(max_length=200)
          created = serializers.DateTimeField()
      ```

      **Ausgabe (Serialisieren):** `CommentSerializer(comment).data` liefert die Daten als Python-Typen.

      **Eingabe (Deserialisieren):**

      ```python
      serializer = CommentSerializer(data=data)
      serializer.is_valid()
      serializer.validated_data
      ```

      Du musst `is_valid()` **immer zuerst** aufrufen, bevor du `validated_data` liest oder
      speicherst. Bei Fehlern enthält `serializer.errors` ein Wörterbuch mit den Meldungen je Feld.
      Mit `is_valid(raise_exception=True)` löst ein Fehler eine `ValidationError` aus, die DRF in
      eine Antwort mit Status 400 verwandelt.
    quiz:
      - frage: "Was musst du vor dem Zugriff auf validated_data aufrufen?"
        erklaerung: "is_valid() muss immer zuerst aufgerufen werden."
        antworten:
          - { text: "is_valid()", richtig: true }
          - { text: "render()", richtig: false }
          - { text: "save()", richtig: false }
      - frage: "Wo findest du die Fehlermeldungen nach einem fehlgeschlagenen is_valid()?"
        erklaerung: "In serializer.errors, einem Wörterbuch mit den Meldungen je Feld."
        antworten:
          - { text: "In serializer.data", richtig: false }
          - { text: "In serializer.errors", richtig: true }
          - { text: "In serializer.validated_data", richtig: false }
  - titel: ModelSerializer und save()
    inhalt: |
      Der **ModelSerializer** spart Schreibarbeit. Gegenüber einem normalen Serializer

      - erzeugt er die Felder automatisch aus dem Modell,
      - erzeugt er passende Prüfungen, zum Beispiel für `unique_together`,
      - bringt er einfache `create()`- und `update()`-Methoden mit.

      ```python
      class AccountSerializer(serializers.ModelSerializer):
          class Meta:
              model = Account
              fields = ['id', 'account_name', 'users', 'created']
      ```

      Die Doku empfiehlt ausdrücklich, die Felder in `fields` **einzeln aufzuzählen**. Seit Version
      3.3.0 ist entweder `fields` oder `exclude` Pflicht.

      **Speichern:** `serializer.save()` ruft `create()` auf, wenn du keine Instanz übergeben hast,
      und `update()`, wenn doch. Mit `serializer.save(owner=request.user)` gibst du zusätzliche
      Werte mit, die in `validated_data` landen.
    quiz:
      - frage: "Was empfiehlt die Doku für Meta.fields im ModelSerializer?"
        erklaerung: "Alle Felder ausdrücklich auflisten."
        antworten:
          - { text: "Nur das Feld id angeben, weil alle anderen Felder abrufbar sind.", richtig: false }
          - { text: "Nie fields angeben, damit alle Felder automatisch enthalten sind.", richtig: false }
          - { text: "Alle zu serialisierenden Felder ausdrücklich aufzählen.", richtig: true }
      - frage: "Wann ruft save() die Methode update() auf?"
        erklaerung: "Wenn dem Serializer eine Instanz übergeben wurde."
        antworten:
          - { text: "Wenn dem Serializer eine Instanz übergeben wurde.", richtig: true }
          - { text: "Nur wenn die übergebenen Daten ungültig sind.", richtig: false }
          - { text: "Immer, unabhängig davon, was dem Serializer übergeben wurde.", richtig: false }
  - titel: Eigene Prüfungen schreiben
    inhalt: |
      Du kannst Eingaben auf zwei Ebenen prüfen.

      **Pro Feld:** Eine Methode `validate_<feldname>` bekommt den Wert. Sie gibt ihn zurück oder
      löst `serializers.ValidationError` aus:

      ```python
      def validate_title(self, value):
          if 'django' not in value.lower():
              raise serializers.ValidationError("Blog post is not about Django")
          return value
      ```

      **Über mehrere Felder:** Die Methode `validate(self, data)` bekommt alle Werte als
      Wörterbuch:

      ```python
      def validate(self, data):
          if data['start'] > data['finish']:
              raise serializers.ValidationError("finish must occur after start")
          return data
      ```

      Bei einer Teiländerung (`PATCH`) enthält `data` nur die gesendeten Felder. Fehlende Werte
      holst du dann aus `self.instance`.
    quiz:
      - frage: "Wie heißt die Methode, die ein einzelnes Feld namens title prüft?"
        erklaerung: "validate_title, also validate_ plus der Feldname."
        antworten:
          - { text: "title_validate", richtig: false }
          - { text: "validate_title", richtig: true }
          - { text: "check_title", richtig: false }
      - frage: "Wofür nutzt du validate(self, data)?"
        erklaerung: "Für Prüfungen, die mehrere Felder gemeinsam betreffen."
        antworten:
          - { text: "Zum Löschen der gespeicherten Daten nach dem Prüfen.", richtig: false }
          - { text: "Nur für die Prüfung des Feldes id.", richtig: false }
          - { text: "Für Prüfungen, die mehrere Felder betreffen.", richtig: true }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Wofür steht der Begriff Deserialisieren?"
      erklaerung: "Eingehende Daten werden geprüft und in native Python-Typen zurückverwandelt."
      antworten:
        - { text: "Eingehende Daten prüfen und in Python-Objekte umwandeln.", richtig: true }
        - { text: "Python-Objekte aus der Datenbank löschen.", richtig: false }
        - { text: "Ein Template zu einer HTML-Seite rendern.", richtig: false }
    - frage: "Was löst is_valid(raise_exception=True) bei ungültigen Daten aus?"
      erklaerung: "Eine ValidationError, die DRF in eine Antwort mit Status 400 verwandelt."
      antworten:
        - { text: "Ein stilles False ohne Fehlermeldung.", richtig: false }
        - { text: "Eine ValidationError, die zu Status 400 führt.", richtig: true }
        - { text: "Einen Neustart des Entwicklungsservers.", richtig: false }
    - frage: "Was erzeugt ein ModelSerializer automatisch?"
      erklaerung: "Felder und passende Prüfungen sowie einfache create() und update()."
      antworten:
        - { text: "Nur die URL-Routen für das Modell.", richtig: false }
        - { text: "Die Datenbanktabelle für das Modell.", richtig: false }
        - { text: "Felder, Prüfungen und einfache create()/update().", richtig: true }
    - frage: "Wie übergibst du beim Speichern einen zusätzlichen Wert, etwa den Besitzer?"
      erklaerung: "Als Argument von save(), zum Beispiel serializer.save(owner=request.user)."
      antworten:
        - { text: "serializer.save(owner=request.user)", richtig: true }
        - { text: "serializer.owner = request", richtig: false }
        - { text: "serializer.is_valid(owner)", richtig: false }
    - frage: "Was enthält data in validate() bei einem PATCH?"
      erklaerung: "Nur die gesendeten Felder."
      antworten:
        - { text: "Immer alle Felder des Modells mit ihren aktuellen Werten.", richtig: false }
        - { text: "Nur die gesendeten Felder.", richtig: true }
        - { text: "Nichts, weil bei PATCH keine Daten geprüft werden.", richtig: false }
