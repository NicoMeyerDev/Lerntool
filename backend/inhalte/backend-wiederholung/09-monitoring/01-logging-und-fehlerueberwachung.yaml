titel: Logging und Fehlerüberwachung
zusammenfassung: Du erinnerst dich an Loggers, Handler, Filter und Formatter, an die Log-Level, an die LOGGING-Einstellung in Django und an die Einrichtung von Sentry.
quellen:
  - titel: Django 5.2 – Logging
    url: https://docs.djangoproject.com/en/5.2/topics/logging/
  - titel: Python – Logging HOWTO
    url: https://docs.python.org/3/howto/logging.html
  - titel: Sentry Docs – Django
    url: https://docs.sentry.io/platforms/python/integrations/django/
abschnitte:
  - titel: Die vier Teile des Loggings
    inhalt: |
      Pythons Logging besteht aus vier Teilen:

      - **Logger:** der Einstiegspunkt. Jeder Logger ist ein benannter „Eimer“, in den Meldungen geschrieben werden.
      - **Handler:** bestimmt, was mit jeder Meldung passiert, zum Beispiel auf den Bildschirm, in eine Datei oder an einen Netzwerk-Socket schreiben.
      - **Filter:** steuert zusätzlich, welche Einträge vom Logger zum Handler gehen.
      - **Formatter:** legt fest, wie ein Eintrag als Text aussieht.

      **Log-Level** (von leicht bis schwer):

      - `DEBUG`: Systeminformationen auf niedriger Ebene zum Fehlersuchen.
      - `INFO`: allgemeine Systeminformationen.
      - `WARNING`: ein kleineres Problem ist aufgetreten.
      - `ERROR`: ein größeres Problem ist aufgetreten.
      - `CRITICAL`: ein kritisches Problem ist aufgetreten.

      Eine Meldung wird nur verarbeitet, wenn ihr Level mindestens so hoch ist wie das Level des Loggers.
      Auch Handler vergleichen so.
    quiz:
      - frage: "Was bestimmt ein Handler?"
        erklaerung: "Was mit jeder Meldung passiert, etwa auf den Bildschirm oder in eine Datei schreiben."
        antworten:
          - { text: "Welches Passwort ein Benutzer für die Anmeldung hat.", richtig: false }
          - { text: "Was mit jeder Meldung passiert, zum Beispiel wohin sie geschrieben wird.", richtig: true }
          - { text: "Wie der Text einer einzelnen Meldung aufgebaut ist.", richtig: false }
      - frage: "Welches Level steht für ein größeres Problem?"
        erklaerung: "ERROR beschreibt ein größeres, CRITICAL ein kritisches Problem."
        antworten:
          - { text: "INFO", richtig: false }
          - { text: "DEBUG", richtig: false }
          - { text: "ERROR", richtig: true }
  - titel: Logging in Django einstellen
    inhalt: |
      Django nutzt standardmäßig das **dictConfig**-Format. Du beschreibst im Wörterbuch `LOGGING`
      in `settings.py` die Logger, Handler, Filter und Formatter.

      Das Beispiel der Doku schickt alles auf die Konsole:

      ```python
      LOGGING = {
          "version": 1,
          "disable_existing_loggers": False,
          "handlers": {
              "console": {
                  "class": "logging.StreamHandler",
              },
          },
          "root": {
              "handlers": ["console"],
              "level": "WARNING",
          },
      }
      ```

      Der `root`-Logger schickt Meldungen ab `WARNING` an den Konsolen-Handler. Mit `INFO` oder `DEBUG`
      siehst du mehr. Setzt du `disable_existing_loggers` auf `True`, werden alle Logger der
      Standardkonfiguration abgeschaltet. Deshalb empfiehlt die Doku `False`.

      Für Django selbst gibt es den Logger `django`. Mit `DJANGO_LOG_LEVEL=DEBUG` siehst du viele
      Details, auch alle Datenbankabfragen.
    quiz:
      - frage: "In welcher Einstellung beschreibst du das Logging in Django?"
        erklaerung: "Im Wörterbuch LOGGING in settings.py."
        antworten:
          - { text: "LOGGING", richtig: true }
          - { text: "DEBUG_LOG", richtig: false }
          - { text: "ALLOWED_HOSTS", richtig: false }
      - frage: "Warum empfiehlt die Doku disable_existing_loggers auf False?"
        erklaerung: "Bei True werden alle Logger der Standardkonfiguration abgeschaltet."
        antworten:
          - { text: "Bei False werden alle Fehler vor dem Nutzer verborgen.", richtig: false }
          - { text: "Bei True würden alle Standard-Logger abgeschaltet.", richtig: true }
          - { text: "Bei False wird die Datenbank spürbar schneller.", richtig: false }
  - titel: Meldungen im Code schreiben
    inhalt: |
      Im Code holst du dir einen Logger und rufst dessen Methoden auf. Die Python-Doku empfiehlt
      einen **Logger pro Modul**, benannt mit `__name__`:

      ```python
      import logging

      logger = logging.getLogger(__name__)

      logger.debug('This message should go to the log file')
      logger.info('So should this')
      logger.warning('And this, too')
      ```

      Die Methoden heißen wie die Level. Die Doku ordnet so zu:

      - `info()` (oder `debug()` für sehr genaue Ausgaben): Ereignisse im normalen Betrieb, zum Beispiel für Überwachung oder Fehlersuche.
      - `warning()`: ein Ereignis, das du festhalten willst, auch wenn der Aufrufer nichts tun kann.
      - `error()`, `exception()` oder `critical()`: Fehler, die du abfängst, ohne eine Ausnahme auszulösen.

      Der Standard-Level ist `WARNING`: Ohne Einstellung werden nur Ereignisse ab `WARNING` festgehalten.

      **Vorsicht mit sensiblen Daten:** Die Django-Doku warnt, dass das Logging potenziell
      sensible Informationen verarbeitet (zum Beispiel Anfragen oder Stacktraces). Du musst wissen,
      welche Informationen gesammelt, wo sie gespeichert, wie sie übertragen werden und wer Zugriff hat.
      **Projektregel (eigene):** Keine Passwörter, Schlüssel oder persönlichen Daten in Logs.
    quiz:
      - frage: "Wie holst du laut Python-Doku üblicherweise einen Logger für ein Modul?"
        erklaerung: "Mit logging.getLogger(__name__), ein Logger pro Modul."
        antworten:
          - { text: "logger = logging.new()", richtig: false }
          - { text: "logger = settings.LOGGING", richtig: false }
          - { text: "logger = logging.getLogger(__name__)", richtig: true }
      - frage: "Welcher Level gilt, wenn du das Logging nicht eigens einstellst?"
        erklaerung: "Der Standard-Level ist WARNING."
        antworten:
          - { text: "WARNING", richtig: true }
          - { text: "DEBUG", richtig: false }
          - { text: "INFO", richtig: false }
  - titel: Fehler an Sentry melden
    inhalt: |
      **Sentry** meldet Fehler aus deiner Anwendung an einen Dienst, in dem du sie ansehen und
      auswerten kannst. Es meldet laut Doku automatisch Fehler, nicht abgefangene Ausnahmen und
      Abstürze.

      **Einrichten (Django):**

      1. Installieren: `pip install "sentry-sdk"`.
      2. In `settings.py` **so früh wie möglich** `sentry_sdk.init()` aufrufen:

      ```python
      import sentry_sdk

      sentry_sdk.init(
          dsn="https://<key>@o<orgId>.ingest.sentry.io/<projectId>",
          traces_sample_rate=1.0,
      )
      ```

      Der `dsn` hat das Format `https://<key>@o<orgId>.ingest.sentry.io/<projectId>` (laut Doku
      ein Platzhalter). `traces_sample_rate=1.0` erfasst 100 Prozent des Tracings. Die Doku
      empfiehlt, den Wert im Betrieb zu **senken**.

      **Datenschutz:** Nutzt du `django.contrib.auth` und aktivierst `send_default_pii=True` (oder
      `user_info` in `data_collection`, der neuere Weg ab SDK 3.0), hängen Nutzerdaten wie ID, E-Mail und Benutzername an die
      Fehlermeldungen.

      **Eigene Regel:** Den DSN legst du als Umgebungsvariable ab, nicht im Git. Ein Sentry-Konto
      anzulegen betrifft Kosten und Datenschutz und wird mit dem Lernenden entschieden.
    quiz:
      - frage: "Wohin gehört der Aufruf von sentry_sdk.init() laut Doku?"
        erklaerung: "In settings.py, so früh wie möglich."
        antworten:
          - { text: "In die Datenbank, damit er bei jeder Abfrage läuft.", richtig: false }
          - { text: "In settings.py, so früh wie möglich.", richtig: true }
          - { text: "In jede einzelne View, am Ende der Funktion.", richtig: false }
      - frage: "Welche Einstellung hängt Nutzerdaten wie E-Mail an Fehlermeldungen?"
        erklaerung: "send_default_pii=True (mit django.contrib.auth)."
        antworten:
          - { text: "traces_sample_rate=1.0", richtig: false }
          - { text: "disable_existing_loggers=False", richtig: false }
          - { text: "send_default_pii=True", richtig: true }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Was ist ein Logger laut Django-Doku?"
      erklaerung: "Der Einstiegspunkt ins Logging, ein benannter Eimer für Meldungen."
      antworten:
        - { text: "Der Einstiegspunkt ins Logging, ein benannter Eimer für Meldungen.", richtig: true }
        - { text: "Eine Datenbanktabelle, in der Meldungen dauerhaft liegen.", richtig: false }
        - { text: "Ein Passwort-Hash, der Meldungen schützt.", richtig: false }
    - frage: "Welche Meldungen verarbeitet ein Logger mit Level WARNING?"
      erklaerung: "Nur Meldungen, deren Level mindestens WARNING ist."
      antworten:
        - { text: "Alle Meldungen aller Level ohne Einschränkung.", richtig: false }
        - { text: "Meldungen ab WARNING (also WARNING, ERROR, CRITICAL).", richtig: true }
        - { text: "Nur Meldungen mit dem Level DEBUG.", richtig: false }
    - frage: "Was beschreibt ein Formatter?"
      erklaerung: "Die genaue Form des Textes eines Log-Eintrags."
      antworten:
        - { text: "Wohin ein Log-Eintrag geschrieben wird.", richtig: false }
        - { text: "Welche Datenbank für die Meldungen genutzt wird.", richtig: false }
        - { text: "Wie ein Log-Eintrag als Text aussieht.", richtig: true }
    - frage: "Was erfasst Sentry laut Doku automatisch?"
      erklaerung: "Fehler, nicht abgefangene Ausnahmen und Abstürze."
      antworten:
        - { text: "Fehler, nicht abgefangene Ausnahmen und Abstürze.", richtig: true }
        - { text: "Alle Passwörter deiner Nutzer zur späteren Auswertung.", richtig: false }
        - { text: "Nur Meldungen mit dem Level DEBUG.", richtig: false }
    - frage: "Was empfiehlt die Doku für traces_sample_rate im Betrieb?"
      erklaerung: "Den Wert gegenüber 1.0 zu senken."
      antworten:
        - { text: "Ihn auf einen frei gewählten Text zu setzen.", richtig: false }
        - { text: "Den Wert gegenüber 1.0 zu senken.", richtig: true }
        - { text: "Ihn immer auf 1.0 zu lassen.", richtig: false }
