titel: Wie das Web funktioniert
zusammenfassung: Du erinnerst dich, wie Client und Server zusammenarbeiten, wofür DNS, IP-Adressen und Pakete da sind und was beim Laden einer Seite passiert.
quellen:
  - titel: MDN – Wie das Web funktioniert
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works
abschnitte:
  - titel: Client und Server
    inhalt: |
      Geräte im Internet sind **Clients** oder **Server**. Clients sind deine Geräte (Laptop, Handy)
      und die Software darauf, meist der **Browser**. Server speichern Webseiten und Apps. Fragt ein
      Client nach einer Seite, wird eine Kopie des Codes zu ihm geschickt und der Browser zeigt sie an.

      **Bild (aus der Quelle):** Das Internet ist eine Straße. Dein Gerät ist dein Haus, der Server ist
      ein Laden, in dem du etwas bestellst. Die Internetverbindung ist die Straße, TCP/IP das Fahrzeug,
      DNS das Nachschlagen der Adresse und HTTP die Sprache, in der du bestellst.

      Eine Webseite besteht aus **Code** (HTML, CSS, JavaScript) und **Dateien** wie Bildern oder PDFs.
    quiz:
      - frage: "Was ist laut MDN ein Client?"
        erklaerung: "Ein Gerät des Nutzers und die Software darauf, meist der Browser."
        antworten:
          - { text: "Ein Gerät des Nutzers und die Software darauf, meist der Browser.", richtig: true }
          - { text: "Eine Leitung, über die zwei Server Daten austauschen.", richtig: false }
          - { text: "Ein Rechner, der Webseiten, Sites oder Apps speichert und ausliefert.", richtig: false }
      - frage: "Woraus besteht eine Webseite?"
        erklaerung: "Aus Code (HTML, CSS, JavaScript) und Dateien wie Bildern."
        antworten:
          - { text: "Nur aus Texten, die der Server bei jedem Aufruf neu schreibt.", richtig: false }
          - { text: "Aus Code (HTML, CSS, JavaScript) und Dateien wie Bildern.", richtig: true }
          - { text: "Nur aus Bildern und Videos, die der Browser abspielt.", richtig: false }
  - titel: DNS, IP-Adresse und Pakete
    inhalt: |
      Menschen merken sich Namen wie `mozilla.org`. Rechner brauchen **IP-Adressen** wie `192.0.2.172`.
      Das **DNS** (Domain Name System) ist das Adressbuch, das einen Namen in die passende IP-Adresse
      übersetzt.

      Die Daten reisen nach den Regeln von **TCP/IP** in kleinen **Paketen**. Jedes Paket hat einen
      **Kopf** (zum Beispiel Absender, Empfänger und Paketnummer) und die **Nutzdaten**. Das hat Vorteile:
      Ein verlorenes Paket muss einzeln neu angefordert werden, und Pakete können verschiedene Wege
      nehmen. Kommen sie durcheinander an, setzt der Client sie anhand der Köpfe wieder zusammen.
    quiz:
      - frage: "Wofür ist DNS da?"
        erklaerung: "Es übersetzt einen Domainnamen in eine IP-Adresse."
        antworten:
          - { text: "Es verschlüsselt die Verbindung zwischen Browser und Server.", richtig: false }
          - { text: "Es speichert eine Kopie der Webseite für schnellere Aufrufe.", richtig: false }
          - { text: "Es übersetzt einen Domainnamen in eine IP-Adresse.", richtig: true }
      - frage: "Warum werden Daten in Pakete zerlegt?"
        erklaerung: "Verlorene Pakete lassen sich einzeln neu anfordern, und Pakete können verschiedene Wege nehmen."
        antworten:
          - { text: "Verlorene Pakete lassen sich einzeln neu anfordern, und Pakete können verschiedene Wege nehmen.", richtig: true }
          - { text: "Damit die Übertragung für jeden Nutzer einzeln abgerechnet werden kann.", richtig: false }
          - { text: "Weil Browser nur kleine Dateien auf einmal anzeigen können.", richtig: false }
  - titel: Was beim Laden einer Seite passiert
    inhalt: |
      Die Quelle beschreibt vier Schritte:

      1. Der Browser fragt das **DNS** nach der IP-Adresse des Servers.
      2. Der Browser schickt eine **HTTP-Anfrage** an den Server (übertragen per TCP/IP).
      3. Ist der Server einverstanden, antwortet er mit `200 OK` und schickt die Dateien als Pakete.
      4. Der Browser setzt die Pakete zusammen und zeigt die Seite an.

      Eine **URL** wie `https://developer.mozilla.org/en-US/` besteht aus dem **Protokoll** (`https`, die
      verschlüsselte Variante von HTTP), dem **Domainnamen** (`developer.mozilla.org`, mit der
      **Subdomain** `developer`) und dem **Pfad** (`/en-US/`).
    quiz:
      - frage: "Was geschieht als Erstes, wenn du eine Adresse im Browser eingibst?"
        erklaerung: "Der Browser fragt das DNS nach der IP-Adresse des Servers."
        antworten:
          - { text: "Der Browser löscht den Cache und lädt alle Dateien neu herunter.", richtig: false }
          - { text: "Der Browser fragt das DNS nach der IP-Adresse des Servers.", richtig: true }
          - { text: "Der Server schickt sofort alle Dateien der Seite an den Browser.", richtig: false }
      - frage: "Was ist in `https://developer.mozilla.org/en-US/` der Pfad?"
        erklaerung: "Der Pfad ist /en-US/."
        antworten:
          - { text: "https", richtig: false }
          - { text: "developer", richtig: false }
          - { text: "/en-US/", richtig: true }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Was ist ein Server laut MDN?"
      erklaerung: "Ein Rechner, der Webseiten, Sites oder Apps speichert."
      antworten:
        - { text: "Ein Rechner, der Webseiten, Sites oder Apps speichert.", richtig: true }
        - { text: "Ein Gerät, das Passwörter für den Browser verwaltet.", richtig: false }
        - { text: "Das Programm, mit dem Nutzer Webseiten anschauen.", richtig: false }
    - frage: "Was bedeutet DNS?"
      erklaerung: "Domain Name System."
      antworten:
        - { text: "Data Name Standard", richtig: false }
        - { text: "Domain Name System", richtig: true }
        - { text: "Digital Network Service", richtig: false }
    - frage: "Was steht im Kopf eines Pakets?"
      erklaerung: "Zum Beispiel Adressen von Client und Server und die Paketnummer."
      antworten:
        - { text: "Das Passwort des Nutzers, damit der Server ihn erkennt.", richtig: false }
        - { text: "Nur die Farbe und das Layout der Seite, die geladen wird.", richtig: false }
        - { text: "Zum Beispiel Adressen von Client und Server und die Paketnummer.", richtig: true }
    - frage: "Was bedeutet das S in https?"
      erklaerung: "Es kennzeichnet die sichere (verschlüsselte) Variante von HTTP."
      antworten:
        - { text: "Es kennzeichnet die sichere (verschlüsselte) Variante von HTTP.", richtig: true }
        - { text: "Es steht für Server und zeigt, dass ein eigener Server genutzt wird.", richtig: false }
        - { text: "Es steht für schnell und kennzeichnet beschleunigte Übertragung.", richtig: false }
    - frage: "Was passiert, wenn Pakete in falscher Reihenfolge ankommen?"
      erklaerung: "Der Client setzt sie anhand der Köpfe wieder richtig zusammen."
      antworten:
        - { text: "Der Server löscht die Seite und sendet sie später erneut.", richtig: false }
        - { text: "Der Client setzt sie anhand der Köpfe wieder richtig zusammen.", richtig: true }
        - { text: "Die Seite wird nie angezeigt, weil die Übertragung abbricht.", richtig: false }
