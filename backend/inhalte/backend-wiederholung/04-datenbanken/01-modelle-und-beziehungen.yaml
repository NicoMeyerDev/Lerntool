titel: Modelle und Beziehungen
zusammenfassung: Du erinnerst dich, wie ein Django-Modell zur Tabelle wird, welche Feldoptionen es gibt und wie ForeignKey, ManyToManyField und OneToOneField Beziehungen abbilden.
quellen:
  - titel: Django 5.2 – Models
    url: https://docs.djangoproject.com/en/5.2/topics/db/models/
  - titel: Django 5.2 – Model field reference (ForeignKey.on_delete)
    url: https://docs.djangoproject.com/en/5.2/ref/models/fields/
abschnitte:
  - titel: Ein Modell ist eine Tabelle
    inhalt: |
      Ein **Modell** ist die einzige, maßgebliche Quelle für deine Daten. Meistens entspricht ein
      Modell **einer Datenbanktabelle**. Es ist eine Python-Klasse, die von `models.Model` erbt.
      Jedes Attribut ist ein Feld, also eine Spalte.

      ```python
      from django.db import models

      class Person(models.Model):
          first_name = models.CharField(max_length=30)
          last_name = models.CharField(max_length=30)
      ```

      Django ergänzt automatisch einen Primärschlüssel `id`. Damit Django das Modell kennt, muss
      die App in `INSTALLED_APPS` stehen.

      **Migrationen:** Neue Apps und Modelle bringst du mit `python manage.py makemigrations`
      (Migration erzeugen) und `python manage.py migrate` (Migration ausführen) in die Datenbank.
      Ändert sich die Reihenfolge von `choices`, entsteht ebenfalls eine neue Migration.
    quiz:
      - frage: "Was entspricht einem Django-Modell in der Datenbank?"
        erklaerung: "Jedes Modell entspricht meistens einer Datenbanktabelle."
        antworten:
          - { text: "Einer Tabelle.", richtig: true }
          - { text: "Einer einzelnen Zeile.", richtig: false }
          - { text: "Einem Index.", richtig: false }
      - frage: "Welcher Befehl führt vorhandene Migrationen in der Datenbank aus?"
        erklaerung: "manage.py migrate führt die Migrationen aus, makemigrations erzeugt sie."
        antworten:
          - { text: "python manage.py makemigrations", richtig: false }
          - { text: "python manage.py runserver", richtig: false }
          - { text: "python manage.py migrate", richtig: true }
  - titel: Felder und ihre Optionen
    inhalt: |
      Felder sind Klassenattribute. Jedes Feld legt Spaltentyp und eine einfache Prüfung fest.
      Manche Felder brauchen Pflichtangaben. Ein `CharField` bekommt meist ein `max_length`, die
      maximale Zeichenzahl. Nur bei PostgreSQL und SQLite ist die Angabe in Django 5.2 optional
      (Referenzseite der Felder).

      Wichtige Optionen:

      - `null`: Bei `True` speichert Django leere Werte als `NULL` (Standard `False`).
      - `blank`: Bei `True` darf das Feld leer bleiben (Standard `False`).
      - `default`: Standardwert, oder eine Funktion, die bei jedem neuen Objekt aufgerufen wird.
      - `choices`: erlaubte Werte als Paare, gespeichert wird der erste Teil, angezeigt der zweite.
      - `unique`: Bei `True` ist der Wert in der Tabelle einmalig.

      **Merksatz aus der Doku:** `null` betrifft nur die Datenbank, `blank` betrifft die Prüfung
      von Eingaben.

      ```python
      YEAR_IN_SCHOOL_CHOICES = [
          ("FR", "Freshman"),
          ("SO", "Sophomore"),
      ]
      ```
    quiz:
      - frage: "Worin unterscheiden sich null und blank?"
        erklaerung: "null betrifft die Datenbank, blank die Validierung."
        antworten:
          - { text: "null betrifft nur Zahlen, blank nur Text.", richtig: false }
          - { text: "null betrifft die Datenbank, blank die Prüfung von Eingaben.", richtig: true }
          - { text: "Beide bedeuten genau dasselbe.", richtig: false }
      - frage: "Was bewirkt unique=True bei einem Feld?"
        erklaerung: "Der Wert darf in der Tabelle nur einmal vorkommen."
        antworten:
          - { text: "Der Wert darf in der Tabelle nur einmal vorkommen.", richtig: true }
          - { text: "Das Feld wird ausgeblendet.", richtig: false }
          - { text: "Das Feld wird automatisch befüllt.", richtig: false }
  - titel: Beziehungen zwischen Modellen
    inhalt: |
      Django kennt drei Beziehungstypen:

      - **Viele zu eins:** `ForeignKey`. Viele Autos gehören zu einem Hersteller.
      - **Viele zu viele:** `ManyToManyField`. Eine Pizza hat viele Beläge, ein Belag liegt auf
        vielen Pizzen.
      - **Eins zu eins:** `OneToOneField`. Ein Datensatz „erweitert“ genau einen anderen.

      ```python
      class Car(models.Model):
          manufacturer = models.ForeignKey(Manufacturer, on_delete=models.CASCADE)

      class Pizza(models.Model):
          toppings = models.ManyToManyField(Topping)
      ```

      Alle drei brauchen als ersten Parameter das Modell, zu dem die Beziehung führt. Beim
      `ForeignKey` und beim `OneToOneField` gehört dazu das Argument `on_delete`. Es legt fest,
      was beim Löschen des referenzierten Objekts passiert (Referenzseite der Felder):

      - `CASCADE`: löscht auch das Objekt, das den `ForeignKey` enthält.
      - `SET_NULL`: setzt den `ForeignKey` auf `NULL`, geht nur mit `null=True`.
      - `PROTECT`: verhindert das Löschen und löst einen `ProtectedError` aus.

      Beim `ManyToManyField` setzt du das Feld nur in **einem** der beiden Modelle, nicht in beiden.
      Brauchst du zusätzliche Daten zur Beziehung, nutzt du ein eigenes Zwischenmodell mit `through`.
    quiz:
      - frage: "Welches Feld bildet „viele Autos gehören zu einem Hersteller“ ab?"
        erklaerung: "Viele-zu-eins-Beziehungen bildet man mit ForeignKey ab, das Feld steht im Modell auf der Viele-Seite."
        antworten:
          - { text: "ManyToManyField in beiden Modellen", richtig: false }
          - { text: "ForeignKey im Modell Car", richtig: true }
          - { text: "OneToOneField im Modell Manufacturer", richtig: false }
      - frage: "In wie vielen Modellen steht ein ManyToManyField laut Doku?"
        erklaerung: "Man setzt es nur in einem der beiden Modelle."
        antworten:
          - { text: "In keinem, Django erkennt es selbst.", richtig: false }
          - { text: "In einem der beiden Modelle.", richtig: true }
          - { text: "In beiden Modellen.", richtig: false }
test:
  zeitlimit_minuten: 10
  fragen:
    - frage: "Von welcher Klasse erbt ein Django-Modell?"
      erklaerung: "Alle Modelle erben von django.db.models.Model."
      antworten:
        - { text: "views.View", richtig: false }
        - { text: "forms.Form", richtig: false }
        - { text: "models.Model", richtig: true }
    - frage: "Wozu dient der Parameter max_length bei CharField?"
      erklaerung: "Er begrenzt die Zeichenzahl des Feldes."
      antworten:
        - { text: "Er begrenzt die Zeichenzahl des Feldes.", richtig: true }
        - { text: "Er ist nur für ForeignKeys gedacht.", richtig: false }
        - { text: "Er sortiert die Tabelle.", richtig: false }
    - frage: "Welches Feld erlaubt es, dass ein Wert in der Datenbank leer (NULL) ist?"
      erklaerung: "null=True speichert leere Werte als NULL."
      antworten:
        - { text: "null=True", richtig: true }
        - { text: "blank=True allein", richtig: false }
        - { text: "unique=True", richtig: false }
    - frage: "Wofür nutzt du through bei einem ManyToManyField?"
      erklaerung: "Mit through gibst du ein eigenes Zwischenmodell für zusätzliche Daten an."
      antworten:
        - { text: "Für ein eigenes Zwischenmodell mit zusätzlichen Daten.", richtig: true }
        - { text: "Um das Feld zu löschen.", richtig: false }
        - { text: "Um die Seite zu cachen.", richtig: false }
    - frage: "Was bewirkt on_delete=models.CASCADE?"
      erklaerung: "CASCADE löscht auch das Objekt, das den ForeignKey enthält."
      antworten:
        - { text: "Der ForeignKey wird auf NULL gesetzt.", richtig: false }
        - { text: "Das Objekt mit dem ForeignKey wird mitgelöscht.", richtig: true }
        - { text: "Das Löschen wird verhindert.", richtig: false }
