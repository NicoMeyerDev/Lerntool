name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      # Nur für die CI, kein echtes Geheimnis.
      DJANGO_SECRET_KEY: ci-nur-zum-testen-kein-geheimnis
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements.txt') != ''
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        if: hashFiles('backend/requirements.txt') != ''
        run: pip install -r requirements.txt
      - name: Linter
        if: hashFiles('backend/requirements.txt') != ''
        run: ruff check . && ruff format --check .
      - name: Typprüfung
        if: hashFiles('backend/requirements.txt') != ''
        run: mypy .
      - name: Django-Check
        if: hashFiles('backend/requirements.txt') != ''
        run: python manage.py check
      - name: Tests
        if: hashFiles('backend/requirements.txt') != ''
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: Linter
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint && npm run format:check
      - name: Tests
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm test
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build
