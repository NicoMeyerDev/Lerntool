# Render-Blueprint der Lern-App: Backend (API) und Frontend (statische Seite).
# Die PostgreSQL-Datenbank legst du vorher selbst im Dashboard an (siehe docs/DEPLOYMENT.md).
# Anleitung: docs/DEPLOYMENT.md
services:
  # Backend: Django mit gunicorn
  - type: web
    name: lerntool-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Der kostenlose Tarif hat keinen Shell-Zugang. Darum laufen Migration, Lerninhalte
    # und Anlegen des eigenen Zugangs beim Start (alle drei sind gefahrlos wiederholbar).
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py import_inhalte &&
      python manage.py anlegen_nutzer &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_HTTPS_ERZWINGEN
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Interne Verbindungs-URL deiner Render-Datenbank (Internal Database URL)
      - key: DATABASE_URL
        sync: false
      # Adresse des Frontends, z. B. https://lerntool.onrender.com (ohne / am Ende)
      - key: DJANGO_CORS_ORIGINS
        sync: false
      # Dein eigener Zugang zur App
      - key: LERNTOOL_BENUTZER
        sync: false
      - key: LERNTOOL_PASSWORT
        sync: false

  # Frontend: statische Seite aus dem Vite-Build
  - type: web
    name: lerntool
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # Adresse des Backends, z. B. https://lerntool-api.onrender.com (ohne / am Ende)
      - key: VITE_API_URL
        sync: false
    routes:
      # Seiten der App (React Router) immer über index.html ausliefern
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
